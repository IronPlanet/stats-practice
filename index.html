answer":"B","difficulty":2,"concept":"clt_core","distractor_logic":"The single most load-bearing fact in the course: raw data keeps its shape, but MEANS of large samples go normal. That's why mean-based inference works at all"},{"id":"d_nor_02","topic":"d_nor","scenario":"Which quantity should you NOT model as normal?","choices":["A. Average handle time across 5,000 calls","B. Measurement error on a scale","C. Individual customer lifetime values (a few whales, many minnows)","D. Sample means of daily sales"],"answer":"C","difficulty":3,"concept":"normal_violation","distractor_logic":"Heavy skew in RAW individual values defies the bell; averages and error terms embrace it. Know which side of the CLT your quantity sits on"},{"id":"d_nor_03","topic":"d_nor","scenario":"HOW does the normal model earn its keep on a dashboard?","choices":["A. Z-scores flag unusual days; percentiles rank performance; tail probabilities price risk","B. It draws the trend line","C. It stores the data","D. It removes outliers"],"answer":"A","difficulty":2,"concept":"normal_how","distractor_logic":"The bell converts raw numbers into 'how unusual': z-scores, percentiles, tail chances. Trends are regression's job; outliers are found, not removed, by z"},{"id":"d_nor_04","topic":"d_nor","scenario":"The classic large-sample CI for a mean \u2014 estimate \u00b1 about 2 standard errors \u2014 leans on which fact?","choices":["A. The empirical rule applied to the sampling distribution: ~95% of sample means land within 2 SE of the truth","B. All data is within 2 SD","C. Margins are always 2","D. Regulation"],"answer":"A","difficulty":3,"concept":"normal_ci_logic","distractor_logic":"The CI's '\u00b12' is the bell's 95% band applied to the distribution of MEANS. It's the CLT and the empirical rule shaking hands"},{"id":"d_nor_05","topic":"d_nor","scenario":"A z-test on average delivery time is appropriate when:","choices":["A. Any time, any n","B. The sample is large, so the mean's distribution is reliably normal","C. n = 6","D. Data is categorical"],"answer":"B","difficulty":2,"concept":"z_when","distractor_logic":"Large n buys you the CLT's bell for the mean. Small samples move you to the t; categories move you to chi-square"},{"id":"d_nor_06","topic":"d_nor","scenario":"Daily sales are right-skewed, yet your month-over-month test on MEAN sales is still trustworthy. Why?","choices":["A. It isn't","B. The test lives on the sample mean, and with a month of days the mean's wobble is near-normal (CLT)","C. Skew is small","D. Tests ignore shape"],"answer":"B","difficulty":3,"concept":"clt_rescue","distractor_logic":"Inference about MEANS survives skewed raw data because it runs on the sampling distribution, not the data's shape. This is the CLT quietly saving most business analytics"},{"id":"d_t_01","topic":"d_t","scenario":"You have 12 stores' results for a pilot program. Why does the analysis use the t-distribution instead of the normal?","choices":["A. Stores are categorical","B. Small sample and unknown true variability \u2014 t's fatter tails price in that extra uncertainty","C. t is newer","D. The normal is only for heights"],"answer":"B","difficulty":2,"concept":"t_why","distractor_logic":"With little data you estimate the spread from the same small sample you're testing \u2014 double uncertainty. The t's wider tails are the honest surcharge"},{"id":"d_t_02","topic":"d_t","scenario":"Degrees of freedom, in plain terms, tracks:","choices":["A. Your alpha level","B. How much independent information the sample really contains \u2014 more df, closer t hugs the normal","C. The number of tests run","D. Effect size"],"answer":"B","difficulty":3,"concept":"df_meaning","distractor_logic":"df \u2248 information count. At df 5 the t is visibly fat-tailed; by df 30+ it's nearly the normal \u2014 which is where the '~30 rule of thumb' comes from"},{"id":"d_t_03","topic":"d_t","scenario":"Same data, same confidence level: how does a t-based CI compare to a z-based one?","choices":["A. Identical","B. The t interval is WIDER \u2014 small samples must admit more uncertainty","C. The t interval is narrower","D. t intervals can't be computed"],"answer":"B","difficulty":2,"concept":"t_ci_width","distractor_logic":"Fatter tails \u2192 bigger multiplier \u2192 wider interval. The width isn't a flaw; it's the honesty small data owes you"},{"id":"d_t_04","topic":"d_t","scenario":"Which everyday course tools are built ON the t-distribution?","choices":["A. One-sample, two-sample, and paired t-tests \u2014 every small-sample mean comparison","B. Pie charts","C. Chi-square tests","D. Poisson rates"],"answer":"A","difficulty":1,"concept":"t_tools","distractor_logic":"The t is the referee inside every t-test and small-sample mean CI in the course \u2014 the single most-used inference distribution in practice"},{"id":"d_t_05","topic":"d_t","scenario":"At what point does the t-vs-z distinction stop mattering much?","choices":["A. Never","B. As n grows past roughly 30, t and normal give nearly identical answers","C. At n = 5","D. When data is skewed"],"answer":"B","difficulty":2,"concept":"t_to_z","distractor_logic":"The fat tails thin as information accumulates; by n \u2248 30+ the two curves nearly coincide. Below that, the t's extra width is doing real protective work"},{"id":"d_t_06","topic":"d_t","scenario":"A consultant reports a razor-thin CI from 7 customer interviews. Your t-distribution instinct says:","choices":["A. Great precision!","B. Suspicion \u2014 7 observations plus honest t-math almost never yields a tight interval; something's overstated","C. Interviews can't be analyzed","D. Increase alpha"],"answer":"B","difficulty":3,"concept":"t_smell_test","distractor_logic":"df = 6 means a big t-multiplier and typically wide intervals. Tiny-n precision is usually a methodology error or wishful reporting \u2014 the t is your lie detector"},{"id":"d_chi_01","topic":"d_chi","scenario":"Do product preferences (A/B/C) differ by region (North/South/East)? Both variables are categories. The referee is:","choices":["A. Chi-square test of association","B. Two-sample t-test","C. Correlation","D. Exponential"],"answer":"A","difficulty":2,"concept":"chi_association","distractor_logic":"Category vs category = chi-square, comparing the observed contingency table to what independence would predict. t and correlation both want numeric variables"},{"id":"d_chi_02","topic":"d_chi","scenario":"Your sales mix ran 50/30/20 across three lines historically; this quarter shows 44/31/25. Which question does chi-square GOODNESS-OF-FIT answer?","choices":["A. Which line is most profitable","B. Is this quarter's mix a real shift from the historical pattern, or normal wobble?","C. What next quarter's mix will be","D. Whether sales are normal"],"answer":"B","difficulty":3,"concept":"chi_gof","distractor_logic":"Goodness-of-fit compares observed category counts against an expected pattern. Profit ranking and forecasting are entirely different tools"},{"id":"d_chi_03","topic":"d_chi","scenario":"HOW does chi-square actually judge a table of counts?","choices":["A. It averages the rows","B. It totals how far observed counts sit from the counts independence would expect \u2014 big total, big surprise","C. It computes r","D. It ranks categories"],"answer":"B","difficulty":3,"concept":"chi_how","distractor_logic":"The statistic is an accumulated observed-vs-expected discrepancy; the chi-square distribution then says how much discrepancy pure chance produces. No means, no r \u2014 just counts"},{"id":"d_chi_04","topic":"d_chi","scenario":"When is chi-square the WRONG tool?","choices":["A. Preference by region","B. Churn (yes/no) by plan type","C. Comparing average revenue between two groups \u2014 the outcome is numeric","D. Defect type by shift"],"answer":"C","difficulty":2,"concept":"chi_not","distractor_logic":"The moment the outcome is a NUMBER (revenue, time, score), you've left chi-square's world for t-tests/ANOVA. Chi-square eats counts of categories, nothing else"},{"id":"d_chi_05","topic":"d_chi","scenario":"A chi-square test on your churn-by-plan table gives p = 0.01. The correct business read:","choices":["A. Plan type and churn are associated \u2014 some plans churn differently than independence predicts","B. Premium plans CAUSE churn","C. Churn is 1%","D. The table is wrong"],"answer":"A","difficulty":3,"concept":"chi_reading","distractor_logic":"Chi-square detects association, not direction and not causation \u2014 it won't even say WHICH plan differs (inspect the table's cells for that). And p is not a churn rate"},{"id":"d_chi_06","topic":"d_chi","scenario":"Survey answers by age group, defect type by factory, click source by device \u2014 what unites every chi-square job?","choices":["A. Small samples","B. Both variables are categorical and the data is a table of counts","C. Time-ordered data","D. Normal outcomes"],"answer":"B","difficulty":1,"concept":"chi_signature","distractor_logic":"The chi-square signature: two categorical variables, counts in cells. If you can't lay it out as a contingency table, it isn't a chi-square problem"},{"id":"d_mix_01","topic":"d_mix","scenario":"Walk the path: 'Did average checkout time improve after the redesign?' (large samples, numeric outcome). The chain is:","choices":["A. Numeric outcome \u2192 mean comparison \u2192 normal/z machinery \u2192 CI on the difference","B. Categories \u2192 chi-square","C. Counts \u2192 Poisson","D. Waits \u2192 exponential, no test"],"answer":"A","difficulty":2,"concept":"path_numeric","distractor_logic":"First identify the DATA TYPE (numeric measurement), then the question (compare means), then the referee (z/t) and its CI. The path is always type \u2192 question \u2192 tool"},{"id":"d_mix_02","topic":"d_mix","scenario":"'Did the redesign change the SHARE of visitors who buy?' The chain is:","choices":["A. Numeric \u2192 t-test","B. Yes/no outcome \u2192 binomial \u2192 two-proportion test with its CI","C. Count per hour \u2192 Poisson","D. Association \u2192 chi-square only"],"answer":"B","difficulty":2,"concept":"path_proportion","distractor_logic":"Share-who-did-it is binomial's yes/no world; the significance machinery is the proportion test. (A 2x2 chi-square would agree \u2014 they're cousins here \u2014 but the proportion CI is the business-readable output)"},{"id":"d_mix_03","topic":"d_mix","scenario":"'Are complaint COUNTS down since the new packaging?' The chain is:","choices":["A. Open-ended counts per period \u2192 Poisson \u2192 rate comparison and CI","B. Fixed trials \u2192 binomial","C. Numeric average \u2192 t-test","D. Categories \u2192 chi-square"],"answer":"A","difficulty":2,"concept":"path_rate","distractor_logic":"No fixed n, events per interval \u2192 Poisson, and the question 'is the new rate really lower?' is a rate test. Choosing binomial here invents a trial count that doesn't exist"},{"id":"d_mix_04","topic":"d_mix","scenario":"ANOVA's verdict comes from the F distribution. What is F comparing?","choices":["A. Two medians","B. Signal vs noise: variation BETWEEN group means against variation WITHIN groups","C. Observed vs expected counts","D. Two proportions"],"answer":"B","difficulty":3,"concept":"f_meaning","distractor_logic":"F is a ratio: if groups truly differ, between-spread dwarfs within-spread and F grows. Counts-vs-expected is chi-square's job; proportions belong to the binomial family"},{"id":"d_mix_05","topic":"d_mix","scenario":"One dataset, four questions: (1) minutes between orders, (2) orders per day, (3) share of orders returned, (4) return reason by product line. Match the models:","choices":["A. (1) exponential, (2) Poisson, (3) binomial, (4) chi-square","B. (1) Poisson, (2) exponential, (3) chi-square, (4) binomial","C. All normal","D. (1) uniform, (2) Poisson, (3) binomial, (4) F"],"answer":"A","difficulty":3,"concept":"grand_matching","distractor_logic":"Gaps \u2192 exponential; open counts \u2192 Poisson; yes/no share \u2192 binomial; category-by-category table \u2192 chi-square. One store, four distributions \u2014 the whole matrix in a day's work"},{"id":"d_mix_06","topic":"d_mix","scenario":"Why does CHOOSING the right distribution matter more than computing with the wrong one?","choices":["A. It doesn't \u2014 math is math","B. The model encodes assumptions about reality; wrong model = confident answers to a world that isn't yours","C. Right models need less data","D. Auditors require it"],"answer":"B","difficulty":3,"concept":"why_choice_matters","distractor_logic":"Perfect arithmetic on a mismatched model produces precise nonsense \u2014 negative wait times, understated tail risks, phantom significance. The choice IS the analysis; the computation is clerical"}];</script>
<script>
const TOPICS = {
  t00:"Sampling & Populations", t01:"Central Tendency", t02:"Variability",
  t03:"Probability", t04:"Hypothesis Testing & Significance",
  t05:"Confidence Intervals", t06:"ANOVA",
  t07:"Correlation & Regression", t09:"Normal Distribution",
  t10:"Choosing a Distribution"};
const TOPIC_NOTES = {
  t00:"A sample is your window on the population. Size fixes wobble (variability); only DESIGN fixes lean (bias) — a bigger biased sample is just more precisely wrong.",
  t01:"Center has three faces: mean (arithmetic balance, outlier-sensitive), median (the middle one, robust), mode (the most common). Mean pulled away from median = skew.",
  t02:"Spread is the other half of every story. SD for typical distance from the mean; IQR when outliers lurk; CV when comparing variability across different scales.",
  t03:"Probability discipline: P(A|B) is not P(B|A), rare things stay rare even with good tests (base rates), and 'and' multiplies only when events are independent.",
  t04:"Significant means one thing: p-value below your chosen alpha. It is evidence AGAINST 'nothing is happening' — not proof, not importance, not effect size.",
  t05:"An interval is an honest estimate: the range of plausible truths. Wider = less data, more noise, or more demanded confidence. If zero is inside, 'no effect' is still on the table.",
  t06:"Three or more group means? ANOVA first — one controlled test. Only after it fires do post-hoc tests say WHICH groups differ. Pairwise t-tests inflate false alarms.",
  t07:"Correlation measures moving-together; regression turns it into predictions. Neither proves causation — hunt the confounder, and never predict outside your data's range.",
  t09:"The bell curve earns its throne through the CLT: AVERAGES go normal even when raw data doesn't. Z-scores make different scales comparable; 68-95-99.7 needs actual normality.",
  t10:"Match the model to the data's birth: counts per interval → Poisson; time between events → exponential; successes in n trials → binomial; sums of many small causes → normal."
};
const DIST_TOPICS = {
  d_bin:"Binomial & Proportions", d_poi:"Poisson & Rates",
  d_exp:"Exponential & Waiting", d_uni:"Uniform",
  d_nor:"Normal & the CLT", d_t:"t & Small Samples",
  d_chi:"Chi-Square & Categories", d_mix:"The Decision Path"};
const DIST_NOTES = {
  d_bin:"Binomial's signature: FIXED n, yes/no outcomes, same chance, independent trials. Every percent-of-people confidence interval and A/B proportion test stands on it.",
  d_poi:"Poisson counts events per interval with no fixed n — one rate runs the whole model. Rates wobble: compare them with their intervals, not by eyeball.",
  d_exp:"Exponential times the GAPS in a Poisson stream. Memoryless = history doesn't age the wait — true for random shocks, false for wear-out.",
  d_uni:"Uniform is a strong claim of perfect indifference, not a shrug. 'Unpredictable' is not 'equally likely' — but all simulation randomness starts here.",
  d_nor:"Raw data keeps its shape; AVERAGES go normal (the CLT). That one fact is why mean-based CIs and tests work on messy business data.",
  d_t:"Small n + unknown spread = the t: fatter tails, wider intervals, honest uncertainty. Past n≈30 it melts into the normal.",
  d_chi:"Chi-square is the referee for TABLES OF COUNTS: category vs category, observed vs expected. The moment your outcome is a number, you've left its world.",
  d_mix:"The path is always: data TYPE → question → tool. Gaps→exponential, open counts→Poisson, fixed-n yes/no→binomial, numbers→normal/t, category tables→chi-square."};
const DECKS = {
  course: {label:"📘 Course Practice", topics: TOPICS, notes: null, key:"sp_stats"},
  dist:   {label:"🎲 Distribution Mastery", topics: DIST_TOPICS, notes: DIST_NOTES, key:"sp_stats_dist"}};
let deck = "course";
const LESSON_SIZE = 10;
let BANK = window.EMBEDDED_BANK || null;
let DIST_BANK = window.EMBEDDED_DIST || null;
function activeBank(){ return deck === "dist" ? DIST_BANK : BANK; }
function activeTopics(){ return DECKS[deck].topics; }
function noteFor(topic){
  return deck === "dist" ? (DIST_NOTES[topic]||"") : (TOPIC_NOTES[topic]||""); }
let queue = [], current = null, firstTry = {}, rightFirst = 0, seenCount = 0,
    lessonTotal = 0, lastTopic = "all", answered = false;

// ── persistent stats (this phone only) ──────────────────────────────
function store(){ try{return JSON.parse(localStorage[DECKS[deck].key]||"{}")}catch(e){return{}} }
function save(s){ try{localStorage.setItem(DECKS[deck].key, JSON.stringify(s))}catch(e){} }
function bumpDay(){
  const s = store(), today = new Date().toDateString();
  if (s.lastDay !== today){
    const y = new Date(Date.now()-864e5).toDateString();
    s.streak = (s.lastDay === y ? (s.streak||0) : 0) + 1;
    s.lastDay = today;
  }
  save(s); return s.streak||1;
}
function recordAnswer(topic, ok){
  const s = store();
  s.n = (s.n||0)+1; s.ok = (s.ok||0)+(ok?1:0);
  s.t = s.t||{}; s.t[topic] = s.t[topic]||{n:0,ok:0};
  s.t[topic].n++; if(ok) s.t[topic].ok++;
  save(s);
}

// ── home ────────────────────────────────────────────────────────────
function setDeck(d){
  deck = d;
  document.getElementById("deckCourse").className = "bigbtn" + (d==="course" ? "" : " ghost");
  document.getElementById("deckDist").className = "bigbtn" + (d==="dist" ? "" : " ghost");
  document.getElementById("deckCourse").style.margin = "0";
  document.getElementById("deckDist").style.margin = "0";
  renderHome();
}
function renderHome(){
  const bank = activeBank();
  const s = store();
  document.getElementById("hStreak").textContent = "🔥 " + (s.streak||0);
  document.getElementById("hAnswered").textContent = s.n||0;
  document.getElementById("hAcc").textContent = s.n ? Math.round(100*s.ok/s.n)+"%" : "–";
  const counts = {};
  bank.forEach(q => counts[q.topic] = (counts[q.topic]||0)+1);
  let html = `<button class="topic all" onclick="startLesson('all')">
      <div class="tn">▶ Mixed lesson — all topics</div>
      <div class="tm">${bank.length} questions in the pool</div></button>`;
  for (const [t, name] of Object.entries(activeTopics())){
    if (!counts[t]) continue;
    const st = (s.t||{})[t]||{n:0,ok:0};
    const pct = st.n ? Math.round(100*st.ok/st.n) : 0;
    html += `<button class="topic" onclick="startLesson('${t}')">
      <div class="tn">${name}</div>
      <div class="mast"><div style="width:${pct}%"></div></div>
      <div class="tm">${counts[t]} Qs · ${st.n? pct+"% right" : "not started"}</div></button>`;
  }
  document.getElementById("topics").innerHTML = html;
}
function goHome(){
  show("home"); renderHome();
  document.getElementById("sheet").className = "sheet";
}

// ── lesson engine ───────────────────────────────────────────────────
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function startLesson(topic){
  lastTopic = topic;
  const pool = activeBank().filter(q => topic==="all" || q.topic===topic);
  queue = shuffle([...pool]).slice(0, Math.min(LESSON_SIZE, pool.length));
  lessonTotal = queue.length;
  firstTry = {}; rightFirst = 0; seenCount = 0;
  show("lesson");
  nextCard();
}
function nextCard(){
  document.getElementById("sheet").className = "sheet";
  if (!queue.length){ return endLesson(); }
  current = queue.shift();
  answered = false;
  const done = lessonTotal - new Set(queue.map(q=>q.id)).size - (firstTry[current.id]===false && queue.every(q=>q.id!==current.id) ? 0 : 0);
  const uniqueLeft = new Set(queue.map(q=>q.id)).size + 1;
  document.getElementById("pfill").style.width =
      (100 * (lessonTotal - uniqueLeft) / lessonTotal) + "%";
  document.getElementById("qcount").textContent = (lessonTotal-uniqueLeft) + "/" + lessonTotal;
  document.getElementById("scenario").textContent = current.scenario;
  document.getElementById("choices").innerHTML = current.choices.map(c =>
    `<button class="choice" data-l="${c[0]}" onclick="pick(this)">${c}</button>`).join("");
  window.scrollTo(0,0);
}
function pick(btn){
  if (answered) return;
  answered = true;
  const chosen = btn.dataset.l, ok = chosen === current.answer;
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.l === current.answer) b.classList.add("correct");
    else if (b === btn && !ok) b.classList.add("wrong");
  });
  const first = !(current.id in firstTry);
  if (first){ firstTry[current.id] = ok; if(ok) rightFirst++; recordAnswer(current.topic, ok); }
  if (!ok){
    // Duolingo rule: you meet it again until you beat it
    const back = Math.min(queue.length, 2 + Math.floor(Math.random()*2));
    queue.splice(back, 0, current);
  }
  const correctText = current.choices.find(c => c[0]===current.answer);
  if (ok){
    const sheet = document.getElementById("sheet");
    sheet.classList.add("up", "good");
    document.getElementById("verdict").textContent = "✓ Correct!";
    document.getElementById("ansline").innerHTML = "<b>Answer:</b> " + correctText;
    document.getElementById("why").textContent = current.distractor_logic || "";
  } else {
    const chosenText = current.choices.find(c => c[0]===chosen);
    setTimeout(() => {
      document.getElementById("exScenario").textContent = current.scenario;
      document.getElementById("exPicked").textContent = chosenText;
      document.getElementById("exCorrect").textContent = correctText;
      document.getElementById("exWhy").textContent = current.distractor_logic || "";
      document.getElementById("exNote").textContent = noteFor(current.topic);
      show("explain");
      window.scrollTo(0,0);
    }, 700);                                   // let the red flash land first
  }
}
function endLesson(){
  const streak = bumpDay();
  const acc = lessonTotal ? Math.round(100*rightFirst/lessonTotal) : 0;
  document.getElementById("sumRight").textContent = rightFirst + "/" + lessonTotal;
  document.getElementById("sumAcc").textContent = acc + "%";
  document.getElementById("sumStreak").textContent = "🔥 " + streak;
  document.getElementById("sumEmoji").textContent = acc>=80 ? "🎉" : acc>=50 ? "💪" : "📚";
  document.getElementById("sumTitle").textContent =
      acc>=80 ? "Excellent!" : acc>=50 ? "Solid work!" : "Keep drilling!";
  show("summary");
}
function backToQuiz(){
  show("lesson");
  nextCard();
}
function show(id){
  for (const s of ["home","lesson","summary","explain"])
    document.getElementById(s).classList.toggle("hidden", s!==id);
}

// ── boot: embedded bank (static/Pages) or fetch (class server) ──────
(async function(){
  try {
    if (!BANK) BANK = await (await fetch("/api/bank")).json();
    if (!DIST_BANK) DIST_BANK = await (await fetch("/api/dist_bank")).json();
  } catch(e){
    if (!BANK){ document.body.innerHTML = "<p style='padding:30px'>Could not load questions.</p>"; return; }
    DIST_BANK = DIST_BANK || [];
  }
  renderHome();
})();
</script>
