<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#131720">
<title>Stats Practice</title>
<style>
:root{--bg:#131720;--panel:#1d2330;--panel2:#242c3d;--ink:#edf1f7;--soft:#8d97a7;
--green:#2fae68;--green-d:#1f7a49;--red:#df4b50;--blue:#4d7fe8;--amber:#d9a72e;--line:#303a4e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;
display:flex;flex-direction:column}
.wrap{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;
margin:0 auto;padding:14px 16px 20px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}

/* ── home ── */
.brand{text-align:center;margin:12px 0 4px;font-size:26px;font-weight:800}
.tag{text-align:center;color:var(--soft);font-size:13.5px;margin-bottom:14px}
.streakbox{display:flex;justify-content:center;gap:26px;background:var(--panel);
border-radius:14px;padding:12px;margin-bottom:16px;font-variant-numeric:tabular-nums}
.streakbox div{text-align:center}
.streakbox b{font-size:22px;display:block}
.streakbox span{font-size:11.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:14px 12px;color:var(--ink);text-align:left}
.topic .tn{font-weight:700;font-size:14.5px;margin-bottom:6px}
.mast{height:6px;background:#2b3345;border-radius:99px;overflow:hidden}
.mast div{height:100%;background:var(--green)}
.topic .tm{font-size:11.5px;color:var(--soft);margin-top:5px}
.topic.all{grid-column:1/-1;background:var(--green-d);border-color:var(--green)}
.topic.all .tn{font-size:16px}

/* ── lesson ── */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.quit{background:none;color:var(--soft);font-size:22px;padding:4px 8px}
.prog{flex:1;height:12px;background:#2b3345;border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--green);transition:width .3s;border-radius:99px}
.qcount{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.scenario{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:18px;font-size:17px;line-height:1.5;margin-bottom:14px;min-height:96px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--panel2);border:2px solid var(--line);border-radius:12px;
padding:14px;color:var(--ink);text-align:left;font-size:15.5px;line-height:1.4}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:var(--green);background:#1c3a2a}
.choice.wrong{border-color:var(--red);background:#3a2124}
.choice:disabled{opacity:.92}

/* ── feedback sheet ── */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
border-top:3px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom));
transform:translateY(105%);transition:transform .25s}
.sheet.up{transform:none}
.sheet.good{border-top-color:var(--green)} .sheet.bad{border-top-color:var(--red)}
.sheet .verdict{font-size:20px;font-weight:800;margin-bottom:6px}
.sheet.good .verdict{color:var(--green)} .sheet.bad .verdict{color:var(--red)}
.sheet .ans{font-size:15px;margin-bottom:8px}
.sheet .why{color:var(--soft);font-size:14.5px;line-height:1.5;margin-bottom:14px}
.cont{width:100%;padding:15px;border-radius:12px;font-size:17px;font-weight:800;color:#fff}
.sheet.good .cont{background:var(--green)} .sheet.bad .cont{background:var(--red)}
.sheetpad{height:210px}

/* ── summary ── */
.sum{text-align:center;margin-top:36px}
.sum .big{font-size:56px}
.sum h2{font-size:24px;margin:10px 0 4px}
.sum .stats{display:flex;justify-content:center;gap:22px;margin:18px 0;
font-variant-numeric:tabular-nums}
.sum .stats b{display:block;font-size:24px}
.sum .stats span{font-size:11.5px;color:var(--soft);text-transform:uppercase}
.bigbtn{display:block;width:100%;padding:16px;border-radius:12px;font-size:17px;
font-weight:800;margin-top:10px;color:#fff;background:var(--green)}
.bigbtn.ghost{background:var(--panel2);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<div id="home">
  <div class="brand">📊 Stats Practice</div>
  <div class="tag">Business statistics, one question at a time. No math, just judgment.</div>
  <div class="streakbox">
    <div><b id="hStreak">🔥 0</b><span>day streak</span></div>
    <div><b id="hAnswered">0</b><span>answered</span></div>
    <div><b id="hAcc">–</b><span>accuracy</span></div>
  </div>
  <div class="topics" id="topics"></div>
</div>

<!-- LESSON -->
<div id="lesson" class="hidden">
  <div class="top">
    <button class="quit" onclick="goHome()">✕</button>
    <div class="prog"><div id="pfill" style="width:0%"></div></div>
    <div class="qcount" id="qcount"></div>
  </div>
  <div class="scenario" id="scenario"></div>
  <div class="choices" id="choices"></div>
  <div class="sheetpad"></div>
</div>

<!-- SUMMARY -->
<div id="summary" class="hidden">
  <div class="sum">
    <div class="big" id="sumEmoji">🎉</div>
    <h2 id="sumTitle">Lesson complete!</h2>
    <div class="stats">
      <div><b id="sumRight">0</b><span>correct</span></div>
      <div><b id="sumAcc">0%</b><span>first-try</span></div>
      <div><b id="sumStreak">🔥 0</b><span>day streak</span></div>
    </div>
    <button class="bigbtn" onclick="startLesson(lastTopic)">Practice again</button>
    <button class="bigbtn ghost" onclick="goHome()">Choose a topic</button>
  </div>
</div>

</div>

<div class="sheet" id="sheet">
  <div class="verdict" id="verdict"></div>
  <div class="ans" id="ansline"></div>
  <div class="why" id="why"></div>
  <button class="cont" id="contbtn" onclick="nextCard()">Continue</button>
</div>

<script>window.EMBEDDED_BANK = [{"id":"t01_001","topic":"t01","scenario":"Your CEO asks: 'What is the typical revenue across our 12 store locations?' Which measure do you report?","choices":["A. Mean","B. Standard deviation","C. Regression","D. ANOVA"],"answer":"A","difficulty":1,"concept":"mean_recognition","distractor_logic":"SD measures spread not center; regression predicts; ANOVA compares groups"},{"id":"t01_002","topic":"t01","scenario":"Home prices in a neighborhood: $210K, $225K, $195K, $240K, $4.8M. Which average best represents the typical home price?","choices":["A. Mean","B. Median","C. Mode","D. Range"],"answer":"B","difficulty":1,"concept":"median_outlier","distractor_logic":"Mean is pulled by $4.8M outlier; mode needs repeated values; range is spread"},{"id":"t01_003","topic":"t01","scenario":"A shoe retailer needs to decide which size to stock the most of. Which measure tells them the most popular size?","choices":["A. Mean","B. Median","C. Mode","D. Variance"],"answer":"C","difficulty":1,"concept":"mode_recognition","distractor_logic":"Mean/median give center values not most frequent; variance is spread"},{"id":"t01_004","topic":"t01","scenario":"Monthly sales: $45K, $47K, $44K, $46K, $48K, $950K. The board wants a fair summary of typical monthly sales.","choices":["A. Mean","B. Median","C. ANOVA","D. Hypothesis test"],"answer":"B","difficulty":2,"concept":"median_skew","distractor_logic":"$950K outlier skews the mean; ANOVA/hypothesis test compare groups or test claims"},{"id":"t01_005","topic":"t01","scenario":"You have 30 customer satisfaction scores (1-10 scale) with no outliers. Management wants a single number summarizing overall satisfaction.","choices":["A. Mean","B. Mode","C. Range","D. Confidence interval"],"answer":"A","difficulty":1,"concept":"mean_symmetric","distractor_logic":"No outliers + numeric scale = mean is best; mode loses precision; range is spread; CI is about precision of estimate"},{"id":"t01_006","topic":"t01","scenario":"Employee ages: most are 25-35, but the CEO is 72. HR wants a summary of the typical employee age.","choices":["A. Mean","B. Median","C. Standard deviation","D. Mode"],"answer":"B","difficulty":2,"concept":"median_outlier","distractor_logic":"CEO age pulls mean up; SD measures spread; mode might cluster but median resists outlier"},{"id":"t01_007","topic":"t01","scenario":"A survey asks customers to pick their preferred payment method: cash, credit card, or mobile app. How do you summarize the results?","choices":["A. Mean","B. Median","C. Mode","D. Standard deviation"],"answer":"C","difficulty":1,"concept":"mode_categorical","distractor_logic":"Categorical data \u2014 can't compute mean/median/SD on payment methods"},{"id":"t01_008","topic":"t01","scenario":"Five stores report quarterly profits: $100K, $105K, $98K, $102K, $101K. All values are close together. Quick summary?","choices":["A. Mean","B. Median","C. Mode","D. ANOVA"],"answer":"A","difficulty":1,"concept":"mean_symmetric","distractor_logic":"No outliers, symmetric-ish data \u2014 mean is the standard choice"},{"id":"t01_009","topic":"t01","scenario":"Customer wait times at a bank: most wait 3-5 minutes, but a few waited over 45 minutes during a system crash. What's the best typical wait time to report?","choices":["A. Mean","B. Median","C. Range","D. Regression"],"answer":"B","difficulty":2,"concept":"median_outlier","distractor_logic":"45-min outliers inflate mean; range tells max-min not typical; regression predicts"},{"id":"t02_001","topic":"t02","scenario":"Two stores have the same average revenue ($120K). Your manager asks which store's revenue is more consistent. What do you calculate?","choices":["A. Mean","B. Standard deviation","C. Median","D. Regression"],"answer":"B","difficulty":1,"concept":"sd_consistency","distractor_logic":"Mean is the same for both; median is center; regression predicts \u2014 need spread measure"},{"id":"t02_002","topic":"t02","scenario":"You're comparing variability of employee salaries ($40K-$200K range) versus office supply costs ($5-$50 range). Different scales. Which metric allows fair comparison?","choices":["A. Standard deviation","B. Coefficient of variation","C. Range","D. Variance"],"answer":"B","difficulty":2,"concept":"cv_different_scales","distractor_logic":"SD and variance are in original units \u2014 can't compare across different scales; range too simple; CV normalizes by mean"},{"id":"t02_003","topic":"t02","scenario":"Your data has extreme outliers. You need a spread measure that isn't heavily influenced by them.","choices":["A. Range","B. Standard deviation","C. Interquartile range (IQR)","D. Variance"],"answer":"C","difficulty":2,"concept":"iqr_robust","distractor_logic":"Range uses min/max (most affected by outliers); SD/variance include all values; IQR uses Q1-Q3 middle 50%"},{"id":"t02_004","topic":"t02","scenario":"A quality manager wants a quick sense of how much daily output varies. 'Just give me the simplest spread number.' What do you report?","choices":["A. Range","B. Variance","C. Coefficient of variation","D. ANOVA"],"answer":"A","difficulty":1,"concept":"range_simple","distractor_logic":"Simplest spread measure = range (max minus min); variance/CV more complex; ANOVA compares groups"},{"id":"t02_005","topic":"t02","scenario":"Two product lines: Product A averages $10 with SD $2. Product B averages $500 with SD $50. Which has more relative variability?","choices":["A. Product A (CV = 20%)","B. Product B (CV = 10%)","C. They're equal","D. Can't compare without more data"],"answer":"A","difficulty":2,"concept":"cv_interpretation","distractor_logic":"Product B has larger SD but smaller CV; relative variability = CV = SD/mean"},{"id":"t02_006","topic":"t02","scenario":"You need to know if store revenues are tightly clustered around the average or widely spread. Which metric?","choices":["A. Mean","B. Median","C. Standard deviation","D. Mode"],"answer":"C","difficulty":1,"concept":"sd_spread","distractor_logic":"Mean/median/mode all measure center, not spread"},{"id":"t02_007","topic":"t02","scenario":"Your dataset has a few values far from the center. Your boss says 'Don't let those weird numbers throw off the spread.' Best metric?","choices":["A. Standard deviation","B. Range","C. IQR","D. Variance"],"answer":"C","difficulty":2,"concept":"iqr_robust","distractor_logic":"IQR ignores extremes by focusing on middle 50%; SD/variance/range all affected by outliers"},{"id":"t04_001","topic":"t04","scenario":"A chain claims their average store revenue is $140K. Your 12 stores average $128K. Is their claim wrong?","choices":["A. ANOVA","B. One-sample t-test","C. Regression","D. Chi-square"],"answer":"B","difficulty":1,"concept":"one_sample_t","distractor_logic":"Testing one sample mean against a claimed value = one-sample t-test; ANOVA compares 3+ groups; regression predicts"},{"id":"t04_002","topic":"t04","scenario":"A supplier claims their defect rate is under 5%. You sampled 200 units and found 14 defective. Can you challenge their claim?","choices":["A. Confidence interval","B. One-sample t-test","C. Hypothesis test for proportion","D. Regression"],"answer":"C","difficulty":2,"concept":"proportion_test","distractor_logic":"Testing a proportion (%), not a mean \u2014 need proportion test; t-test is for means; CI estimates but doesn't formally test"},{"id":"t04_003","topic":"t04","scenario":"Before and after a training program, you measure the same 20 employees' productivity. Did the training help?","choices":["A. Two-sample t-test","B. Paired t-test","C. ANOVA","D. Chi-square"],"answer":"B","difficulty":2,"concept":"paired_t","distractor_logic":"Same people measured twice = paired; two-sample is for independent groups; ANOVA for 3+ groups"},{"id":"t04_004","topic":"t04","scenario":"Two different stores' customer satisfaction scores. Are customers at Store A happier than Store B?","choices":["A. One-sample t-test","B. Two-sample t-test","C. Paired t-test","D. ANOVA"],"answer":"B","difficulty":1,"concept":"two_sample_t","distractor_logic":"Two independent groups being compared = two-sample; one-sample tests against a fixed value; paired needs same subjects"},{"id":"t04_005","topic":"t04","scenario":"You got a p-value of 0.03 and your significance level is 0.05. What's your decision?","choices":["A. Reject H0","B. Fail to reject H0","C. Accept H0","D. Need more data"],"answer":"A","difficulty":1,"concept":"p_value_decision","distractor_logic":"p < alpha means reject; we never 'accept' H0; 0.03 < 0.05 is clear"},{"id":"t04_006","topic":"t04","scenario":"A bakery claims average loaf weight is 500g. You weigh 15 loaves and get a mean of 485g. Is the bakery's claim plausible?","choices":["A. ANOVA","B. One-sample t-test","C. Confidence interval","D. Standard deviation"],"answer":"B","difficulty":1,"concept":"one_sample_t","distractor_logic":"Testing a sample against a specific claim = t-test; CI could work but t-test is the direct approach"},{"id":"t04_007","topic":"t04","scenario":"You got a p-value of 0.12. Alpha is 0.05. What do you conclude?","choices":["A. Reject H0","B. Fail to reject H0","C. The result is significant","D. Accept H0"],"answer":"B","difficulty":1,"concept":"p_value_decision","distractor_logic":"p > alpha means fail to reject; never 'accept' H0; 0.12 > 0.05 is not significant"},{"id":"t04_008","topic":"t04","scenario":"New drug tested on two groups: treatment (n=30) and placebo (n=30). Is the treatment group's outcome significantly better?","choices":["A. Paired t-test","B. Two-sample t-test","C. One-sample t-test","D. ANOVA"],"answer":"B","difficulty":2,"concept":"two_sample_t","distractor_logic":"Different people in each group = independent samples; paired needs same people; one-sample needs a fixed value"},{"id":"t04_009","topic":"t04","scenario":"A company measures employee satisfaction before and after an office redesign. Same 50 employees surveyed both times.","choices":["A. Two-sample t-test","B. Paired t-test","C. ANOVA","D. Regression"],"answer":"B","difficulty":2,"concept":"paired_t","distractor_logic":"Same subjects measured twice = paired design; independent t-test is for different groups"},{"id":"t05_001","topic":"t05","scenario":"You sampled 30 customers and they spend $85 on average. How precisely can you estimate the population's average spending?","choices":["A. Hypothesis test","B. Confidence interval","C. Standard deviation","D. ANOVA"],"answer":"B","difficulty":1,"concept":"ci_estimation","distractor_logic":"CI gives a range for the true mean; hypothesis test tests a specific claim; SD is just spread"},{"id":"t05_002","topic":"t05","scenario":"Your boss asks: 'What's the range we can be 95% sure the true average customer spending falls in?'","choices":["A. 95% confidence interval","B. Hypothesis test at 0.05","C. Standard deviation","D. Range"],"answer":"A","difficulty":1,"concept":"ci_interpretation","distractor_logic":"'Range we're 95% sure' = confidence interval; range is max-min; SD is spread"},{"id":"t05_003","topic":"t05","scenario":"A poll of 500 voters shows 52% support a candidate. The margin of error is reported as \u00b13%. What statistical concept is this?","choices":["A. Hypothesis test","B. Confidence interval","C. Standard deviation","D. p-value"],"answer":"B","difficulty":1,"concept":"ci_margin_of_error","distractor_logic":"Margin of error = half-width of a confidence interval; it's estimation, not testing"},{"id":"t05_004","topic":"t05","scenario":"You want to estimate the average delivery time for your company. You sample 50 deliveries. What do you construct?","choices":["A. Confidence interval","B. Hypothesis test","C. ANOVA","D. Regression model"],"answer":"A","difficulty":1,"concept":"ci_estimation","distractor_logic":"'Estimate' an average = CI; no claim to test = not hypothesis test"},{"id":"t05_005","topic":"t05","scenario":"You have a 95% CI of ($78, $92) for mean spending. A competitor claims their customers average $95. What can you say?","choices":["A. Their claim is within our CI \u2014 plausible","B. Their claim is outside our CI \u2014 likely different","C. Need a t-test to be sure","D. Nothing \u2014 CIs can't compare"],"answer":"B","difficulty":2,"concept":"ci_claim_check","distractor_logic":"$95 is outside (78,92) so the claim is inconsistent with our data; CI can informally check claims"},{"id":"t05_006","topic":"t05","scenario":"You want a narrower confidence interval for your mean. What should you do?","choices":["A. Increase sample size","B. Increase confidence level","C. Increase variability","D. Use the median instead"],"answer":"A","difficulty":2,"concept":"ci_width_factors","distractor_logic":"Larger n = narrower CI; higher confidence = wider CI; more variability = wider CI"},{"id":"t06_001","topic":"t06","scenario":"Revenue dropped at 3 of your 12 locations. Is there a significant difference in mean revenue across three regions (East, Central, West)?","choices":["A. Two-sample t-test","B. ANOVA","C. Chi-square","D. Regression"],"answer":"B","difficulty":1,"concept":"anova_recognition","distractor_logic":"3 groups = ANOVA; t-test only handles 2 groups; chi-square is for categorical data"},{"id":"t06_002","topic":"t06","scenario":"You have 4 different marketing campaigns and want to know if they produce different average sales. Which test?","choices":["A. ANOVA","B. t-test","C. Regression","D. Confidence interval"],"answer":"A","difficulty":1,"concept":"anova_recognition","distractor_logic":"4 groups being compared = ANOVA; t-test only compares 2"},{"id":"t06_003","topic":"t06","scenario":"Three suppliers provide parts. You want to know if average quality differs across suppliers. You have 10 samples from each.","choices":["A. ANOVA","B. Paired t-test","C. Chi-square","D. Standard deviation"],"answer":"A","difficulty":1,"concept":"anova_recognition","distractor_logic":"3 independent groups comparing means = one-way ANOVA"},{"id":"t06_004","topic":"t06","scenario":"Your ANOVA F-statistic is 0.85 with a p-value of 0.45. What does this mean?","choices":["A. Groups are significantly different","B. Groups are NOT significantly different","C. Need more groups","D. Need a t-test instead"],"answer":"B","difficulty":2,"concept":"anova_interpretation","distractor_logic":"p = 0.45 >> 0.05 = fail to reject; groups are not significantly different"},{"id":"t06_005","topic":"t06","scenario":"Only TWO stores are being compared on average monthly revenue. Which test?","choices":["A. ANOVA","B. Two-sample t-test","C. Chi-square","D. Paired t-test"],"answer":"B","difficulty":2,"concept":"t_vs_anova","distractor_logic":"2 independent groups = t-test; ANOVA works for 2 but t-test is standard; paired needs same subjects"},{"id":"t06_006","topic":"t06","scenario":"Five different training programs are compared on employee test scores. 20 employees in each program. Which test?","choices":["A. t-test","B. ANOVA","C. Regression","D. Confidence interval"],"answer":"B","difficulty":1,"concept":"anova_recognition","distractor_logic":"5 groups = ANOVA; can't do a single t-test for 5 groups"},{"id":"t06_007","topic":"t06","scenario":"You ran ANOVA and got a significant result (p < 0.05). You know the groups differ. But WHICH groups differ?","choices":["A. Run more ANOVAs","B. Post-hoc test (e.g., Tukey)","C. Look at the means","D. Chi-square"],"answer":"B","difficulty":3,"concept":"posthoc_recognition","distractor_logic":"ANOVA says 'at least one differs' \u2014 post-hoc tests identify which pairs"},{"id":"t07_001","topic":"t07","scenario":"You need to predict next quarter's revenue based on advertising spend. Which tool?","choices":["A. ANOVA","B. Confidence interval","C. Regression","D. Chi-square"],"answer":"C","difficulty":1,"concept":"regression_prediction","distractor_logic":"Predicting one variable from another = regression; ANOVA compares groups; CI estimates a parameter"},{"id":"t07_002","topic":"t07","scenario":"Is there a linear relationship between employee experience (years) and productivity (units/day)?","choices":["A. t-test","B. ANOVA","C. Regression/correlation","D. Confidence interval"],"answer":"C","difficulty":1,"concept":"correlation_recognition","distractor_logic":"Relationship between two numeric variables = regression/correlation"},{"id":"t07_003","topic":"t07","scenario":"For every $1,000 increase in ad spend, how much does revenue change? You need the exact rate of change.","choices":["A. Mean","B. Standard deviation","C. Regression slope","D. ANOVA"],"answer":"C","difficulty":1,"concept":"regression_slope","distractor_logic":"Rate of change between X and Y = regression slope (b1 coefficient)"},{"id":"t07_004","topic":"t07","scenario":"R-squared = 0.89 in your revenue vs. ad spend model. What does this tell you?","choices":["A. The model is significant","B. 89% of revenue variation is explained by ad spend","C. Revenue will increase 89%","D. 89% of data points are correct"],"answer":"B","difficulty":2,"concept":"r_squared_interpretation","distractor_logic":"R\u00b2 = proportion of variance explained; not about significance, not a prediction"},{"id":"t07_005","topic":"t07","scenario":"A store's revenue seems to increase as foot traffic increases. Which analysis quantifies this relationship?","choices":["A. ANOVA","B. Regression","C. Hypothesis test","D. Confidence interval"],"answer":"B","difficulty":1,"concept":"regression_recognition","distractor_logic":"Quantifying relationship between two continuous variables = regression"},{"id":"t07_006","topic":"t07","scenario":"You built a regression model: Revenue = $10,000 + $3.50 \u00d7 (Ad Spend). How much revenue do you predict for $5,000 in ad spend?","choices":["A. $13,500","B. $17,500","C. $27,500","D. $50,000"],"answer":"C","difficulty":2,"concept":"regression_predict_calc","distractor_logic":"$10,000 + $3.50 \u00d7 5,000 = $10,000 + $17,500 = $27,500"},{"id":"t07_007","topic":"t07","scenario":"Correlation between hours studied and exam scores is r = 0.15. What does this suggest?","choices":["A. Strong positive relationship","B. Weak positive relationship","C. No relationship","D. Strong negative relationship"],"answer":"B","difficulty":1,"concept":"correlation_strength","distractor_logic":"r = 0.15 is positive but weak (close to 0); not 'no relationship' because it's not 0"},{"id":"t07_008","topic":"t07","scenario":"Your model predicts revenue from both ad spend AND store size. How many predictor variables?","choices":["A. 0","B. 1 \u2014 simple regression","C. 2 \u2014 multiple regression","D. 3"],"answer":"C","difficulty":2,"concept":"multiple_regression","distractor_logic":"Two predictors (ad spend + store size) = multiple regression"},{"id":"t03_001","topic":"t03","scenario":"30% of customers buy Product A. If you randomly pick one customer, what's the chance they bought Product A?","choices":["A. 0.30","B. 0.70","C. Need a t-test","D. Need sample size"],"answer":"A","difficulty":1,"concept":"basic_probability","distractor_logic":"Direct probability reading \u2014 30% = 0.30"},{"id":"t03_002","topic":"t03","scenario":"40% of returns are due to defects, 25% to wrong size, 35% other. What's the probability a return is NOT due to defects?","choices":["A. 0.40","B. 0.60","C. 0.25","D. 0.35"],"answer":"B","difficulty":1,"concept":"complement_rule","distractor_logic":"P(not defect) = 1 - P(defect) = 1 - 0.40 = 0.60"},{"id":"t03_003","topic":"t03","scenario":"P(rain) = 0.3 and P(traffic | rain) = 0.8. What's the probability of both rain AND traffic?","choices":["A. 0.24","B. 0.80","C. 1.10","D. 0.30"],"answer":"A","difficulty":2,"concept":"multiplication_rule","distractor_logic":"P(rain AND traffic) = P(rain) \u00d7 P(traffic|rain) = 0.3 \u00d7 0.8 = 0.24"},{"id":"t03_004","topic":"t03","scenario":"Events A and B are independent. P(A) = 0.5, P(B) = 0.4. What is P(A and B)?","choices":["A. 0.90","B. 0.20","C. 0.10","D. 0.50"],"answer":"B","difficulty":1,"concept":"independent_multiplication","distractor_logic":"Independent: P(A and B) = P(A) \u00d7 P(B) = 0.5 \u00d7 0.4 = 0.20"},{"id":"t03_005","topic":"t03","scenario":"In a batch of 100 products, 5 are defective. You pick 2 at random WITHOUT replacement. Is the second pick independent of the first?","choices":["A. Yes \u2014 always independent","B. No \u2014 sampling without replacement changes probabilities","C. Yes \u2014 if batch is large enough","D. Depends on defect rate"],"answer":"B","difficulty":2,"concept":"independence_without_replacement","distractor_logic":"Without replacement = dependent events; the first draw changes the pool"},{"id":"t03_006","topic":"t03","scenario":"60% of employees are full-time and 80% of full-timers have benefits. What percentage of all employees are full-time WITH benefits?","choices":["A. 80%","B. 60%","C. 48%","D. 140%"],"answer":"C","difficulty":2,"concept":"conditional_multiplication","distractor_logic":"P(FT and benefits) = 0.60 \u00d7 0.80 = 0.48 = 48%"},{"id":"t09_001","topic":"t09","scenario":"A value is 2 standard deviations above the mean in a normal distribution. Approximately what percentage of values fall below it?","choices":["A. 50%","B. 68%","C. 95%","D. 97.5%"],"answer":"D","difficulty":2,"concept":"empirical_rule","distractor_logic":"2 SD above mean: ~95% within \u00b12 SD, so ~97.5% below +2 SD"},{"id":"t09_002","topic":"t09","scenario":"Your data has mean = 100 and SD = 15. What's the z-score for a value of 130?","choices":["A. 2.0","B. 1.5","C. 3.0","D. 0.5"],"answer":"A","difficulty":1,"concept":"z_score_calculation","distractor_logic":"z = (130 - 100) / 15 = 30/15 = 2.0"},{"id":"t09_003","topic":"t09","scenario":"A student scores in the 84th percentile. Using the empirical rule, about how many standard deviations above the mean is this?","choices":["A. 0.5 SD","B. 1 SD","C. 2 SD","D. 3 SD"],"answer":"B","difficulty":2,"concept":"empirical_rule_percentile","distractor_logic":"68% within \u00b11 SD \u2192 84% below +1 SD (50% + 34%)"},{"id":"t09_004","topic":"t09","scenario":"Daily sales follow a normal distribution with mean $5,000 and SD $800. What's the probability of a day exceeding $6,600 in sales?","choices":["A. About 2.5%","B. About 5%","C. About 16%","D. About 50%"],"answer":"A","difficulty":2,"concept":"normal_tail_probability","distractor_logic":"z = (6600-5000)/800 = 2.0; P(Z > 2) \u2248 2.5%"},{"id":"t09_005","topic":"t09","scenario":"Salaries at your firm: mean $60k, SD $8k, roughly normal. A new analyst offer is $76k. What is its z-score?","choices":["A. 1.0","B. 2.0","C. 0.5","D. 16"],"answer":"B","difficulty":2,"concept":"z_score_calculation","distractor_logic":"z=(76-60)/8=2.0; 16 is the raw gap not standardized; 1.0 forgets to divide fully"},{"id":"t09_006","topic":"t09","scenario":"Two sales reps: Ana sold $520k in Region A (mean $400k, SD $60k). Ben sold $310k in Region B (mean $250k, SD $20k). Who performed better RELATIVE to their region?","choices":["A. Ana \u2014 higher dollars","B. Ben \u2014 higher z-score","C. Tie","D. Cannot compare different regions"],"answer":"B","difficulty":3,"concept":"z_score_comparison","distractor_logic":"Ana z=2.0, Ben z=3.0 \u2014 z-scores make different scales comparable; raw dollars ignore context; D is false, standardizing is exactly how you compare"},{"id":"t09_007","topic":"t09","scenario":"Delivery times are normal: mean 30 min, SD 5 min. You promise 'under 40 minutes or free.' Roughly what fraction of orders are free?","choices":["A. ~16%","B. ~5%","C. ~2.5%","D. ~0.3%"],"answer":"C","difficulty":3,"concept":"normal_tail_probability","distractor_logic":"40 is +2 SD; ~95% within \u00b12 SD leaves 5% in BOTH tails \u2014 only the upper 2.5% exceeds 40; 16% is the +1 SD tail; 0.3% is beyond \u00b13 SD"},{"id":"t09_008","topic":"t09","scenario":"Customer satisfaction scores are roughly normal with mean 7.0 and SD 0.5. About 68% of customers score between:","choices":["A. 6.5 and 7.5","B. 6.0 and 8.0","C. 5.5 and 8.5","D. 7.0 and 8.0"],"answer":"A","difficulty":1,"concept":"empirical_rule","distractor_logic":"68% is within \u00b11 SD (6.5-7.5); B is \u00b12 SD (95%); D is not centered on the mean"},{"id":"t09_009","topic":"t09","scenario":"Your revenue-per-customer data is HEAVILY right-skewed (a few whales). A colleague uses the empirical rule to claim '95% of customers are within 2 SD of the mean.' What's wrong?","choices":["A. Nothing \u2014 the rule always holds","B. The empirical rule requires roughly normal data","C. Should use 3 SD instead","D. SD can't be computed on skewed data"],"answer":"B","difficulty":3,"concept":"empirical_rule_assumptions","distractor_logic":"68-95-99.7 is a NORMAL-distribution fact; skew breaks it. SD computes fine on any data (D false); 3 SD doesn't rescue a wrong assumption"},{"id":"t01_010","topic":"t01","scenario":"For your firm's salaries, the mean is $72k and the median is $58k. Without seeing the data, what does this gap tell you?","choices":["A. Right-skewed \u2014 a few high salaries pull the mean up","B. Left-skewed","C. The data is normal","D. Someone made an error"],"answer":"A","difficulty":3,"concept":"mean_median_skew_inference","distractor_logic":"Mean dragged above median = long right tail (executive salaries); left skew would flip it; normal data would have them roughly equal"},{"id":"t02_008","topic":"t02","scenario":"Product A: mean daily sales $2,000, SD $300. Product B: mean $50,000, SD $4,000. Which has MORE RELATIVE variability?","choices":["A. B \u2014 bigger SD","B. A \u2014 higher coefficient of variation","C. Equal","D. Can't compare different products"],"answer":"B","difficulty":3,"concept":"cv_different_scales","distractor_logic":"CV_A=300/2000=15%, CV_B=4000/50000=8% \u2014 CV standardizes spread by the mean; raw SD comparison across scales misleads"},{"id":"t03_007","topic":"t03","scenario":"1% of shipments are defective. Your test flags 95% of defective shipments, but also flags 10% of good ones. A shipment is FLAGGED. The chance it's actually defective is closest to:","choices":["A. 95%","B. ~9%","C. 50%","D. 10%"],"answer":"B","difficulty":3,"concept":"conditional_base_rate","distractor_logic":"P(defect|flag) is not P(flag|defect). Flags: .01x.95 + .99x.10 = .1085; true: .0095; .0095/.1085 = 8.8%. The base rate dominates"},{"id":"t04_010","topic":"t04","scenario":"You list each store's sales the month BEFORE a promo and the month AFTER \u2014 same 25 stores, two columns. Which test fits?","choices":["A. Two-sample t \u2014 there are two columns","B. Paired t \u2014 same stores measured twice","C. ANOVA","D. Proportion test"],"answer":"B","difficulty":3,"concept":"paired_t","distractor_logic":"Two columns of the SAME units = paired, not independent samples; the column layout disguises the pairing"},{"id":"t04_011","topic":"t04","scenario":"With n = 2 million users, an A/B test finds a $0.02 lift in average order value, p = 0.001. What's the right takeaway?","choices":["A. Ship it \u2014 highly significant","B. Statistically significant but practically trivial \u2014 judge the effect size","C. The p-value must be wrong","D. Increase n to be sure"],"answer":"B","difficulty":3,"concept":"practical_vs_statistical","distractor_logic":"Huge n makes tiny effects 'significant' \u2014 significance is not importance; the p-value is fine; more n makes it worse, not clearer"},{"id":"t05_007","topic":"t05","scenario":"A 95% CI for average handle time is (4.2, 5.8) minutes. Management claims the true average is 6.0. At the 5% level (two-sided), the claim:","choices":["A. Is supported \u2014 6.0 is close","B. Would be rejected \u2014 6.0 lies outside the interval","C. Needs a bigger sample to evaluate","D. Can't be tested with a CI"],"answer":"B","difficulty":3,"concept":"ci_test_duality","distractor_logic":"A 95% CI contains exactly the values a two-sided 5% test would NOT reject; 6.0 outside = reject. CI-test duality is the point"},{"id":"t06_008","topic":"t06","scenario":"You have 5 regions and compare their mean sales with t-tests on every pair (10 tests) at 5% each. The real risk is:","choices":["A. Nothing \u2014 that's standard","B. Inflated false-positive rate \u2014 use ANOVA first","C. t-tests can't compare means","D. Too few tests"],"answer":"B","difficulty":3,"concept":"multiple_comparisons","distractor_logic":"Ten 5% tests \u2248 40% chance of at least one false positive; ANOVA controls the family-wise error, then post-hoc"},{"id":"t07_009","topic":"t07","scenario":"Your regression predicts sales from ad spend, fitted on spends of $1k-$10k. Marketing asks for the prediction at $50k. You should:","choices":["A. Plug it in \u2014 the equation works anywhere","B. Warn: that's extrapolation far outside the fitted range","C. Refuse to model ad spend","D. Use correlation instead"],"answer":"B","difficulty":3,"concept":"extrapolation_risk","distractor_logic":"The line is only evidence-backed within the observed range; at 5x beyond it the relationship may bend or saturate"},{"id":"t07_010","topic":"t07","scenario":"Ice-cream-truck staffing correlates r = 0.85 with beach-town retail sales. The honest explanation is most likely:","choices":["A. Staffing drives sales \u2014 hire more","B. Sales drive staffing","C. A third factor (summer season) drives both","D. r = 0.85 proves causation"],"answer":"C","difficulty":3,"concept":"confounding_variable","distractor_logic":"Season is the classic confounder moving both series; correlation alone orders no causal arrow, and 0.85 'strong' doesn't change that"}];</script>
<script>
const TOPICS = {
  t01:"Central Tendency", t02:"Variability", t03:"Probability",
  t04:"Hypothesis Testing", t05:"Confidence Intervals", t06:"ANOVA",
  t07:"Correlation & Regression", t09:"Normal Distribution"};
const LESSON_SIZE = 10;
let BANK = window.EMBEDDED_BANK || null;
let queue = [], current = null, firstTry = {}, rightFirst = 0, seenCount = 0,
    lessonTotal = 0, lastTopic = "all", answered = false;

// ── persistent stats (this phone only) ──────────────────────────────
function store(){ try{return JSON.parse(localStorage.sp_stats||"{}")}catch(e){return{}} }
function save(s){ try{localStorage.setItem("sp_stats", JSON.stringify(s))}catch(e){} }
function bumpDay(){
  const s = store(), today = new Date().toDateString();
  if (s.lastDay !== today){
    const y = new Date(Date.now()-864e5).toDateString();
    s.streak = (s.lastDay === y ? (s.streak||0) : 0) + 1;
    s.lastDay = today;
  }
  save(s); return s.streak||1;
}
function recordAnswer(topic, ok){
  const s = store();
  s.n = (s.n||0)+1; s.ok = (s.ok||0)+(ok?1:0);
  s.t = s.t||{}; s.t[topic] = s.t[topic]||{n:0,ok:0};
  s.t[topic].n++; if(ok) s.t[topic].ok++;
  save(s);
}

// ── home ────────────────────────────────────────────────────────────
function renderHome(){
  const s = store();
  document.getElementById("hStreak").textContent = "🔥 " + (s.streak||0);
  document.getElementById("hAnswered").textContent = s.n||0;
  document.getElementById("hAcc").textContent = s.n ? Math.round(100*s.ok/s.n)+"%" : "–";
  const counts = {};
  BANK.forEach(q => counts[q.topic] = (counts[q.topic]||0)+1);
  let html = `<button class="topic all" onclick="startLesson('all')">
      <div class="tn">▶ Mixed lesson — all topics</div>
      <div class="tm">${BANK.length} questions in the pool</div></button>`;
  for (const [t, name] of Object.entries(TOPICS)){
    if (!counts[t]) continue;
    const st = (s.t||{})[t]||{n:0,ok:0};
    const pct = st.n ? Math.round(100*st.ok/st.n) : 0;
    html += `<button class="topic" onclick="startLesson('${t}')">
      <div class="tn">${name}</div>
      <div class="mast"><div style="width:${pct}%"></div></div>
      <div class="tm">${counts[t]} Qs · ${st.n? pct+"% right" : "not started"}</div></button>`;
  }
  document.getElementById("topics").innerHTML = html;
}
function goHome(){
  show("home"); renderHome();
  document.getElementById("sheet").className = "sheet";
}

// ── lesson engine ───────────────────────────────────────────────────
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function startLesson(topic){
  lastTopic = topic;
  const pool = BANK.filter(q => topic==="all" || q.topic===topic);
  queue = shuffle([...pool]).slice(0, Math.min(LESSON_SIZE, pool.length));
  lessonTotal = queue.length;
  firstTry = {}; rightFirst = 0; seenCount = 0;
  show("lesson");
  nextCard();
}
function nextCard(){
  document.getElementById("sheet").className = "sheet";
  if (!queue.length){ return endLesson(); }
  current = queue.shift();
  answered = false;
  const done = lessonTotal - new Set(queue.map(q=>q.id)).size - (firstTry[current.id]===false && queue.every(q=>q.id!==current.id) ? 0 : 0);
  const uniqueLeft = new Set(queue.map(q=>q.id)).size + 1;
  document.getElementById("pfill").style.width =
      (100 * (lessonTotal - uniqueLeft) / lessonTotal) + "%";
  document.getElementById("qcount").textContent = (lessonTotal-uniqueLeft) + "/" + lessonTotal;
  document.getElementById("scenario").textContent = current.scenario;
  document.getElementById("choices").innerHTML = current.choices.map(c =>
    `<button class="choice" data-l="${c[0]}" onclick="pick(this)">${c}</button>`).join("");
  window.scrollTo(0,0);
}
function pick(btn){
  if (answered) return;
  answered = true;
  const chosen = btn.dataset.l, ok = chosen === current.answer;
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.l === current.answer) b.classList.add("correct");
    else if (b === btn && !ok) b.classList.add("wrong");
  });
  const first = !(current.id in firstTry);
  if (first){ firstTry[current.id] = ok; if(ok) rightFirst++; recordAnswer(current.topic, ok); }
  if (!ok){
    // Duolingo rule: you meet it again until you beat it
    const back = Math.min(queue.length, 2 + Math.floor(Math.random()*2));
    queue.splice(back, 0, current);
  }
  const correctText = current.choices.find(c => c[0]===current.answer);
  const sheet = document.getElementById("sheet");
  sheet.classList.add("up", ok ? "good" : "bad");
  document.getElementById("verdict").textContent = ok ? "✓ Correct!" : "✗ Not quite";
  document.getElementById("ansline").innerHTML = "<b>Answer:</b> " + correctText;
  document.getElementById("why").textContent = current.distractor_logic || "";
}
function endLesson(){
  const streak = bumpDay();
  const acc = lessonTotal ? Math.round(100*rightFirst/lessonTotal) : 0;
  document.getElementById("sumRight").textContent = rightFirst + "/" + lessonTotal;
  document.getElementById("sumAcc").textContent = acc + "%";
  document.getElementById("sumStreak").textContent = "🔥 " + streak;
  document.getElementById("sumEmoji").textContent = acc>=80 ? "🎉" : acc>=50 ? "💪" : "📚";
  document.getElementById("sumTitle").textContent =
      acc>=80 ? "Excellent!" : acc>=50 ? "Solid work!" : "Keep drilling!";
  show("summary");
}
function show(id){
  for (const s of ["home","lesson","summary"])
    document.getElementById(s).classList.toggle("hidden", s!==id);
}

// ── boot: embedded bank (static/Pages) or fetch (class server) ──────
(async function(){
  if (!BANK){
    try { BANK = await (await fetch("/api/bank")).json(); }
    catch(e){ document.body.innerHTML = "<p style='padding:30px'>Could not load questions.</p>"; return; }
  }
  renderHome();
})();
</script>
</body>
</html>
