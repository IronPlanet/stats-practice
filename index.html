<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#131720">
<title>Stats Practice</title>
<style>
:root{--bg:#131720;--panel:#1d2330;--panel2:#242c3d;--ink:#edf1f7;--soft:#8d97a7;
--green:#2fae68;--green-d:#1f7a49;--red:#df4b50;--blue:#4d7fe8;--amber:#d9a72e;--line:#303a4e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;
display:flex;flex-direction:column}
.wrap{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;
margin:0 auto;padding:14px 16px 20px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}

/* ── home ── */
.brand{text-align:center;margin:12px 0 4px;font-size:26px;font-weight:800}
.tag{text-align:center;color:var(--soft);font-size:13.5px;margin-bottom:14px}
.streakbox{display:flex;justify-content:center;gap:26px;background:var(--panel);
border-radius:14px;padding:12px;margin-bottom:16px;font-variant-numeric:tabular-nums}
.streakbox div{text-align:center}
.streakbox b{font-size:22px;display:block}
.streakbox span{font-size:11.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:14px 12px;color:var(--ink);text-align:left}
.topic .tn{font-weight:700;font-size:14.5px;margin-bottom:6px}
.mast{height:6px;background:#2b3345;border-radius:99px;overflow:hidden}
.mast div{height:100%;background:var(--green)}
.topic .tm{font-size:11.5px;color:var(--soft);margin-top:5px}
.topic.all{grid-column:1/-1;background:var(--green-d);border-color:var(--green)}
.topic.all .tn{font-size:16px}

/* ── lesson ── */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.quit{background:none;color:var(--soft);font-size:22px;padding:4px 8px}
.prog{flex:1;height:12px;background:#2b3345;border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--green);transition:width .3s;border-radius:99px}
.qcount{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.scenario{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:18px;font-size:17px;line-height:1.5;margin-bottom:14px;min-height:96px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--panel2);border:2px solid var(--line);border-radius:12px;
padding:14px;color:var(--ink);text-align:left;font-size:15.5px;line-height:1.4}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:var(--green);background:#1c3a2a}
.choice.wrong{border-color:var(--red);background:#3a2124}
.choice:disabled{opacity:.92}

/* ── feedback sheet ── */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
border-top:3px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom));
transform:translateY(105%);transition:transform .25s}
.sheet.up{transform:none}
.sheet.good{border-top-color:var(--green)} .sheet.bad{border-top-color:var(--red)}
.sheet .verdict{font-size:20px;font-weight:800;margin-bottom:6px}
.sheet.good .verdict{color:var(--green)} .sheet.bad .verdict{color:var(--red)}
.sheet .ans{font-size:15px;margin-bottom:8px}
.sheet .why{color:var(--soft);font-size:14.5px;line-height:1.5;margin-bottom:14px}
.cont{width:100%;padding:15px;border-radius:12px;font-size:17px;font-weight:800;color:#fff}
.sheet.good .cont{background:var(--green)} .sheet.bad .cont{background:var(--red)}
.sheetpad{height:210px}

/* ── summary ── */
.sum{text-align:center;margin-top:36px}
.sum .big{font-size:56px}
.sum h2{font-size:24px;margin:10px 0 4px}
.sum .stats{display:flex;justify-content:center;gap:22px;margin:18px 0;
font-variant-numeric:tabular-nums}
.sum .stats b{display:block;font-size:24px}
.sum .stats span{font-size:11.5px;color:var(--soft);text-transform:uppercase}
.bigbtn{display:block;width:100%;padding:16px;border-radius:12px;font-size:17px;
font-weight:800;margin-top:10px;color:#fff;background:var(--green)}
.bigbtn.ghost{background:var(--panel2);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<div id="home">
  <div class="brand">📊 Stats Practice</div>
  <div class="tag">Business statistics, one question at a time. No math, just judgment.</div>
  <div class="streakbox">
    <div><b id="hStreak">🔥 0</b><span>day streak</span></div>
    <div><b id="hAnswered">0</b><span>answered</span></div>
    <div><b id="hAcc">–</b><span>accuracy</span></div>
  </div>
  <div class="topics" id="topics"></div>
</div>

<!-- LESSON -->
<div id="lesson" class="hidden">
  <div class="top">
    <button class="quit" onclick="goHome()">✕</button>
    <div class="prog"><div id="pfill" style="width:0%"></div></div>
    <div class="qcount" id="qcount"></div>
  </div>
  <div class="scenario" id="scenario"></div>
  <div class="choices" id="choices"></div>
  <div class="sheetpad"></div>
</div>

<!-- EXPLAIN (wrong answer) -->
<div id="explain" class="hidden">
  <div style="font-size:22px;font-weight:800;color:var(--red);margin:14px 0 10px">✗ Not quite — here's the idea</div>
  <div class="scenario" id="exScenario" style="font-size:15px;min-height:0"></div>
  <div style="background:#3a2124;border:1px solid var(--red);border-radius:12px;padding:12px 14px;margin-bottom:10px">
    <div style="font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">You picked</div>
    <div id="exPicked" style="font-size:15px"></div>
  </div>
  <div style="background:#1c3a2a;border:1px solid var(--green);border-radius:12px;padding:12px 14px;margin-bottom:10px">
    <div style="font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">The answer</div>
    <div id="exCorrect" style="font-size:15px;font-weight:600"></div>
  </div>
  <div style="background:var(--panel);border-radius:12px;padding:14px;margin-bottom:10px">
    <div style="font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Why</div>
    <div id="exWhy" style="font-size:14.5px;line-height:1.55"></div>
  </div>
  <div style="background:var(--panel);border-left:3px solid var(--blue);border-radius:0 12px 12px 0;padding:14px;margin-bottom:16px">
    <div style="font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Big picture</div>
    <div id="exNote" style="font-size:14.5px;line-height:1.55;color:var(--soft)"></div>
  </div>
  <button class="bigbtn" onclick="backToQuiz()">← Back to the quiz</button>
  <div style="text-align:center;color:var(--soft);font-size:12.5px;margin-top:10px">This one comes back later in the lesson.</div>
</div>

<!-- SUMMARY -->
<div id="summary" class="hidden">
  <div class="sum">
    <div class="big" id="sumEmoji">🎉</div>
    <h2 id="sumTitle">Lesson complete!</h2>
    <div class="stats">
      <div><b id="sumRight">0</b><span>correct</span></div>
      <div><b id="sumAcc">0%</b><span>first-try</span></div>
      <div><b id="sumStreak">🔥 0</b><span>day streak</span></div>
    </div>
    <button class="bigbtn" onclick="startLesson(lastTopic)">Practice again</button>
    <button class="bigbtn ghost" onclick="goHome()">Choose a topic</button>
  </div>
</div>

</div>

<div class="sheet" id="sheet">
  <div class="verdict" id="verdict"></div>
  <div class="ans" id="ansline"></div>
  <div class="why" id="why"></div>
  <button class="cont" id="contbtn" onclick="nextCard()">Continue</button>
</div>

<script>window.EMBEDDED_BANK = [{"id":"t01_001","topic":"t01","scenario":"Your CEO asks: 'What is the typical revenue across our 12 store locations?' Which measure do you report?","choices":["A. Mean","B. Standard deviation","C. Regression","D. ANOVA"],"answer":"A","difficulty":1,"concept":"mean_recognition","distractor_logic":"SD measures spread not center; regression predicts; ANOVA compares groups"},{"id":"t01_002","topic":"t01","scenario":"Home prices in a neighborhood: $210K, $225K, $195K, $240K, $4.8M. Which average best represents the typical home price?","choices":["A. Mean","B. Median","C. Mode","D. Range"],"answer":"B","difficulty":1,"concept":"median_outlier","distractor_logic":"Mean is pulled by $4.8M outlier; mode needs repeated values; range is spread"},{"id":"t01_003","topic":"t01","scenario":"A shoe retailer needs to decide which size to stock the most of. Which measure tells them the most popular size?","choices":["A. Mean","B. Median","C. Mode","D. Variance"],"answer":"C","difficulty":1,"concept":"mode_recognition","distractor_logic":"Mean/median give center values not most frequent; variance is spread"},{"id":"t01_004","topic":"t01","scenario":"Monthly sales: $45K, $47K, $44K, $46K, $48K, $950K. The board wants a fair summary of typical monthly sales.","choices":["A. Mean","B. Median","C. ANOVA","D. Hypothesis test"],"answer":"B","difficulty":2,"concept":"median_skew","distractor_logic":"$950K outlier skews the mean; ANOVA/hypothesis test compare groups or test claims"},{"id":"t01_005","topic":"t01","scenario":"You have 30 customer satisfaction scores (1-10 scale) with no outliers. Management wants a single number summarizing overall satisfaction.","choices":["A. Mean","B. Mode","C. Range","D. Confidence interval"],"answer":"A","difficulty":1,"concept":"mean_symmetric","distractor_logic":"No outliers + numeric scale = mean is best; mode loses precision; range is spread; CI is about precision of estimate"},{"id":"t01_006","topic":"t01","scenario":"Employee ages: most are 25-35, but the CEO is 72. HR wants a summary of the typical employee age.","choices":["A. Mean","B. Median","C. Standard deviation","D. Mode"],"answer":"B","difficulty":2,"concept":"median_outlier","distractor_logic":"CEO age pulls mean up; SD measures spread; mode might cluster but median resists outlier"},{"id":"t01_007","topic":"t01","scenario":"A survey asks customers to pick their preferred payment method: cash, credit card, or mobile app. How do you summarize the results?","choices":["A. Mean","B. Median","C. Mode","D. Standard deviation"],"answer":"C","difficulty":1,"concept":"mode_categorical","distractor_logic":"Categorical data \u2014 can't compute mean/median/SD on payment methods"},{"id":"t01_008","topic":"t01","scenario":"Five stores report quarterly profits: $100K, $105K, $98K, $102K, $101K. All values are close together. Quick summary?","choices":["A. Mean","B. Median","C. Mode","D. ANOVA"],"answer":"A","difficulty":1,"concept":"mean_symmetric","distractor_logic":"No outliers, symmetric-ish data \u2014 mean is the standard choice"},{"id":"t01_009","topic":"t01","scenario":"Customer wait times at a bank: most wait 3-5 minutes, but a few waited over 45 minutes during a system crash. What's the best typical wait time to report?","choices":["A. Mean","B. Median","C. Range","D. Regression"],"answer":"B","difficulty":2,"concept":"median_outlier","distractor_logic":"45-min outliers inflate mean; range tells max-min not typical; regression predicts"},{"id":"t02_001","topic":"t02","scenario":"Two stores have the same average revenue ($120K). Your manager asks which store's revenue is more consistent. What do you calculate?","choices":["A. Mean","B. Standard deviation","C. Median","D. Regression"],"answer":"B","difficulty":1,"concept":"sd_consistency","distractor_logic":"Mean is the same for both; median is center; regression predicts \u2014 need spread measure"},{"id":"t02_002","topic":"t02","scenario":"You're comparing variability of employee salaries ($40K-$200K range) versus office supply costs ($5-$50 range). Different scales. Which metric allows fair comparison?","choices":["A. Standard deviation","B. Coefficient of variation","C. Range","D. Variance"],"answer":"B","difficulty":2,"concept":"cv_different_scales","distractor_logic":"SD and variance are in original units \u2014 can't compare across different scales; range too simple; CV normalizes by mean"},{"id":"t02_003","topic":"t02","scenario":"Your data has extreme outliers. You need a spread measure that isn't heavily influenced by them.","choices":["A. Range","B. Standard deviation","C. Interquartile range (IQR)","D. Variance"],"answer":"C","difficulty":2,"concept":"iqr_robust","distractor_logic":"Range uses min/max (most affected by outliers); SD/variance include all values; IQR uses Q1-Q3 middle 50%"},{"id":"t02_004","topic":"t02","scenario":"A quality manager wants a quick sense of how much daily output varies. 'Just give me the simplest spread number.' What do you report?","choices":["A. Range","B. Variance","C. Coefficient of variation","D. ANOVA"],"answer":"A","difficulty":1,"concept":"range_simple","distractor_logic":"Simplest spread measure = range (max minus min); variance/CV more complex; ANOVA compares groups"},{"id":"t02_005","topic":"t02","scenario":"Two product lines: Product A averages $10 with SD $2. Product B averages $500 with SD $50. Which has more relative variability?","choices":["A. Product A (CV = 20%)","B. Product B (CV = 10%)","C. They're equal","D. Can't compare without more data"],"answer":"A","difficulty":2,"concept":"cv_interpretation","distractor_logic":"Product B has larger SD but smaller CV; relative variability = CV = SD/mean"},{"id":"t02_006","topic":"t02","scenario":"You need to know if store revenues are tightly clustered around the average or widely spread. Which metric?","choices":["A. Mean","B. Median","C. Standard deviation","D. Mode"],"answer":"C","difficulty":1,"concept":"sd_spread","distractor_logic":"Mean/median/mode all measure center, not spread"},{"id":"t02_007","topic":"t02","scenario":"Your dataset has a few values far from the center. Your boss says 'Don't let those weird numbers throw off the spread.' Best metric?","choices":["A. Standard deviation","B. Range","C. IQR","D. Variance"],"answer":"C","difficulty":2,"concept":"iqr_robust","distractor_logic":"IQR ignores extremes by focusing on middle 50%; SD/variance/range all affected by outliers"},{"id":"t04_001","topic":"t04","scenario":"A chain claims their average store revenue is $140K. Your 12 stores average $128K. Is their claim wrong?","choices":["A. ANOVA","B. One-sample t-test","C. Regression","D. Chi-square"],"answer":"B","difficulty":1,"concept":"one_sample_t","distractor_logic":"Testing one sample mean against a claimed value = one-sample t-test; ANOVA compares 3+ groups; regression predicts"},{"id":"t04_002","topic":"t04","scenario":"A supplier claims their defect rate is under 5%. You sampled 200 units and found 14 defective. Can you challenge their claim?","choices":["A. Confidence interval","B. One-sample t-test","C. Hypothesis test for proportion","D. Regression"],"answer":"C","difficulty":2,"concept":"proportion_test","distractor_logic":"Testing a proportion (%), not a mean \u2014 need proportion test; t-test is for means; CI estimates but doesn't formally test"},{"id":"t04_003","topic":"t04","scenario":"Before and after a training program, you measure the same 20 employees' productivity. Did the training help?","choices":["A. Two-sample t-test","B. Paired t-test","C. ANOVA","D. Chi-square"],"answer":"B","difficulty":2,"concept":"paired_t","distractor_logic":"Same people measured twice = paired; two-sample is for independent groups; ANOVA for 3+ groups"},{"id":"t04_004","topic":"t04","scenario":"Two different stores' customer satisfaction scores. Are customers at Store A happier than Store B?","choices":["A. One-sample t-test","B. Two-sample t-test","C. Paired t-test","D. ANOVA"],"answer":"B","difficulty":1,"concept":"two_sample_t","distractor_logic":"Two independent groups being compared = two-sample; one-sample tests against a fixed value; paired needs same subjects"},{"id":"t04_005","topic":"t04","scenario":"You got a p-value of 0.03 and your significance level is 0.05. What's your decision?","choices":["A. Reject H0","B. Fail to reject H0","C. Accept H0","D. Need more data"],"answer":"A","difficulty":1,"concept":"p_value_decision","distractor_logic":"p < alpha means reject; we never 'accept' H0; 0.03 < 0.05 is clear"},{"id":"t04_006","topic":"t04","scenario":"A bakery claims average loaf weight is 500g. You weigh 15 loaves and get a mean of 485g. Is the bakery's claim plausible?","choices":["A. ANOVA","B. One-sample t-test","C. Confidence interval","D. Standard deviation"],"answer":"B","difficulty":1,"concept":"one_sample_t","distractor_logic":"Testing a sample against a specific claim = t-test; CI could work but t-test is the direct approach"},{"id":"t04_007","topic":"t04","scenario":"You got a p-value of 0.12. Alpha is 0.05. What do you conclude?","choices":["A. Reject H0","B. Fail to reject H0","C. The result is significant","D. Accept H0"],"answer":"B","difficulty":1,"concept":"p_value_decision","distractor_logic":"p > alpha means fail to reject; never 'accept' H0; 0.12 > 0.05 is not significant"},{"id":"t04_008","topic":"t04","scenario":"New drug tested on two groups: treatment (n=30) and placebo (n=30). Is the treatment group's outcome significantly better?","choices":["A. Paired t-test","B. Two-sample t-test","C. One-sample t-test","D. ANOVA"],"answer":"B","difficulty":2,"concept":"two_sample_t","distractor_logic":"Different people in each group = independent samples; paired needs same people; one-sample needs a fixed value"},{"id":"t04_009","topic":"t04","scenario":"A company measures employee satisfaction before and after an office redesign. Same 50 employees surveyed both times.","choices":["A. Two-sample t-test","B. Paired t-test","C. ANOVA","D. Regression"],"answer":"B","difficulty":2,"concept":"paired_t","distractor_logic":"Same subjects measured twice = paired design; independent t-test is for different groups"},{"id":"t05_001","topic":"t05","scenario":"You sampled 30 customers and they spend $85 on average. How precisely can you estimate the population's average spending?","choices":["A. Hypothesis test","B. Confidence interval","C. Standard deviation","D. ANOVA"],"answer":"B","difficulty":1,"concept":"ci_estimation","distractor_logic":"CI gives a range for the true mean; hypothesis test tests a specific claim; SD is just spread"},{"id":"t05_002","topic":"t05","scenario":"Your boss asks: 'What's the range we can be 95% sure the true average customer spending falls in?'","choices":["A. 95% confidence interval","B. Hypothesis test at 0.05","C. Standard deviation","D. Range"],"answer":"A","difficulty":1,"concept":"ci_interpretation","distractor_logic":"'Range we're 95% sure' = confidence interval; range is max-min; SD is spread"},{"id":"t05_003","topic":"t05","scenario":"A poll of 500 voters shows 52% support a candidate. The margin of error is reported as \u00b13%. What statistical concept is this?","choices":["A. Hypothesis test","B. Confidence interval","C. Standard deviation","D. p-value"],"answer":"B","difficulty":1,"concept":"ci_margin_of_error","distractor_logic":"Margin of error = half-width of a confidence interval; it's estimation, not testing"},{"id":"t05_004","topic":"t05","scenario":"You want to estimate the average delivery time for your company. You sample 50 deliveries. What do you construct?","choices":["A. Confidence interval","B. Hypothesis test","C. ANOVA","D. Regression model"],"answer":"A","difficulty":1,"concept":"ci_estimation","distractor_logic":"'Estimate' an average = CI; no claim to test = not hypothesis test"},{"id":"t05_005","topic":"t05","scenario":"You have a 95% CI of ($78, $92) for mean spending. A competitor claims their customers average $95. What can you say?","choices":["A. Their claim is within our CI \u2014 plausible","B. Their claim is outside our CI \u2014 likely different","C. Need a t-test to be sure","D. Nothing \u2014 CIs can't compare"],"answer":"B","difficulty":2,"concept":"ci_claim_check","distractor_logic":"$95 is outside (78,92) so the claim is inconsistent with our data; CI can informally check claims"},{"id":"t05_006","topic":"t05","scenario":"You want a narrower confidence interval for your mean. What should you do?","choices":["A. Increase sample size","B. Increase confidence level","C. Increase variability","D. Use the median instead"],"answer":"A","difficulty":2,"concept":"ci_width_factors","distractor_logic":"Larger n = narrower CI; higher confidence = wider CI; more variability = wider CI"},{"id":"t06_001","topic":"t06","scenario":"Revenue dropped at 3 of your 12 locations. Is there a significant difference in mean revenue across three regions (East, Central, West)?","choices":["A. Two-sample t-test","B. ANOVA","C. Chi-square","D. Regression"],"answer":"B","difficulty":1,"concept":"anova_recognition","distractor_logic":"3 groups = ANOVA; t-test only handles 2 groups; chi-square is for categorical data"},{"id":"t06_002","topic":"t06","scenario":"You have 4 different marketing campaigns and want to know if they produce different average sales. Which test?","choices":["A. ANOVA","B. t-test","C. Regression","D. Confidence interval"],"answer":"A","difficulty":1,"concept":"anova_recognition","distractor_logic":"4 groups being compared = ANOVA; t-test only compares 2"},{"id":"t06_003","topic":"t06","scenario":"Three suppliers provide parts. You want to know if average quality differs across suppliers. You have 10 samples from each.","choices":["A. ANOVA","B. Paired t-test","C. Chi-square","D. Standard deviation"],"answer":"A","difficulty":1,"concept":"anova_recognition","distractor_logic":"3 independent groups comparing means = one-way ANOVA"},{"id":"t06_004","topic":"t06","scenario":"Your ANOVA F-statistic is 0.85 with a p-value of 0.45. What does this mean?","choices":["A. Groups are significantly different","B. Groups are NOT significantly different","C. Need more groups","D. Need a t-test instead"],"answer":"B","difficulty":2,"concept":"anova_interpretation","distractor_logic":"p = 0.45 >> 0.05 = fail to reject; groups are not significantly different"},{"id":"t06_005","topic":"t06","scenario":"Only TWO stores are being compared on average monthly revenue. Which test?","choices":["A. ANOVA","B. Two-sample t-test","C. Chi-square","D. Paired t-test"],"answer":"B","difficulty":2,"concept":"t_vs_anova","distractor_logic":"2 independent groups = t-test; ANOVA works for 2 but t-test is standard; paired needs same subjects"},{"id":"t06_006","topic":"t06","scenario":"Five different training programs are compared on employee test scores. 20 employees in each program. Which test?","choices":["A. t-test","B. ANOVA","C. Regression","D. Confidence interval"],"answer":"B","difficulty":1,"concept":"anova_recognition","distractor_logic":"5 groups = ANOVA; can't do a single t-test for 5 groups"},{"id":"t06_007","topic":"t06","scenario":"You ran ANOVA and got a significant result (p < 0.05). You know the groups differ. But WHICH groups differ?","choices":["A. Run more ANOVAs","B. Post-hoc test (e.g., Tukey)","C. Look at the means","D. Chi-square"],"answer":"B","difficulty":3,"concept":"posthoc_recognition","distractor_logic":"ANOVA says 'at least one differs' \u2014 post-hoc tests identify which pairs"},{"id":"t07_001","topic":"t07","scenario":"You need to predict next quarter's revenue based on advertising spend. Which tool?","choices":["A. ANOVA","B. Confidence interval","C. Regression","D. Chi-square"],"answer":"C","difficulty":1,"concept":"regression_prediction","distractor_logic":"Predicting one variable from another = regression; ANOVA compares groups; CI estimates a parameter"},{"id":"t07_002","topic":"t07","scenario":"Is there a linear relationship between employee experience (years) and productivity (units/day)?","choices":["A. t-test","B. ANOVA","C. Regression/correlation","D. Confidence interval"],"answer":"C","difficulty":1,"concept":"correlation_recognition","distractor_logic":"Relationship between two numeric variables = regression/correlation"},{"id":"t07_003","topic":"t07","scenario":"For every $1,000 increase in ad spend, how much does revenue change? You need the exact rate of change.","choices":["A. Mean","B. Standard deviation","C. Regression slope","D. ANOVA"],"answer":"C","difficulty":1,"concept":"regression_slope","distractor_logic":"Rate of change between X and Y = regression slope (b1 coefficient)"},{"id":"t07_004","topic":"t07","scenario":"R-squared = 0.89 in your revenue vs. ad spend model. What does this tell you?","choices":["A. The model is significant","B. 89% of revenue variation is explained by ad spend","C. Revenue will increase 89%","D. 89% of data points are correct"],"answer":"B","difficulty":2,"concept":"r_squared_interpretation","distractor_logic":"R\u00b2 = proportion of variance explained; not about significance, not a prediction"},{"id":"t07_005","topic":"t07","scenario":"A store's revenue seems to increase as foot traffic increases. Which analysis quantifies this relationship?","choices":["A. ANOVA","B. Regression","C. Hypothesis test","D. Confidence interval"],"answer":"B","difficulty":1,"concept":"regression_recognition","distractor_logic":"Quantifying relationship between two continuous variables = regression"},{"id":"t07_006","topic":"t07","scenario":"You built a regression model: Revenue = $10,000 + $3.50 \u00d7 (Ad Spend). How much revenue do you predict for $5,000 in ad spend?","choices":["A. $13,500","B. $17,500","C. $27,500","D. $50,000"],"answer":"C","difficulty":2,"concept":"regression_predict_calc","distractor_logic":"$10,000 + $3.50 \u00d7 5,000 = $10,000 + $17,500 = $27,500"},{"id":"t07_007","topic":"t07","scenario":"Correlation between hours studied and exam scores is r = 0.15. What does this suggest?","choices":["A. Strong positive relationship","B. Weak positive relationship","C. No relationship","D. Strong negative relationship"],"answer":"B","difficulty":1,"concept":"correlation_strength","distractor_logic":"r = 0.15 is positive but weak (close to 0); not 'no relationship' because it's not 0"},{"id":"t07_008","topic":"t07","scenario":"Your model predicts revenue from both ad spend AND store size. How many predictor variables?","choices":["A. 0","B. 1 \u2014 simple regression","C. 2 \u2014 multiple regression","D. 3"],"answer":"C","difficulty":2,"concept":"multiple_regression","distractor_logic":"Two predictors (ad spend + store size) = multiple regression"},{"id":"t03_001","topic":"t03","scenario":"30% of customers buy Product A. If you randomly pick one customer, what's the chance they bought Product A?","choices":["A. 0.30","B. 0.70","C. Need a t-test","D. Need sample size"],"answer":"A","difficulty":1,"concept":"basic_probability","distractor_logic":"Direct probability reading \u2014 30% = 0.30"},{"id":"t03_002","topic":"t03","scenario":"40% of returns are due to defects, 25% to wrong size, 35% other. What's the probability a return is NOT due to defects?","choices":["A. 0.40","B. 0.60","C. 0.25","D. 0.35"],"answer":"B","difficulty":1,"concept":"complement_rule","distractor_logic":"P(not defect) = 1 - P(defect) = 1 - 0.40 = 0.60"},{"id":"t03_003","topic":"t03","scenario":"P(rain) = 0.3 and P(traffic | rain) = 0.8. What's the probability of both rain AND traffic?","choices":["A. 0.24","B. 0.80","C. 1.10","D. 0.30"],"answer":"A","difficulty":2,"concept":"multiplication_rule","distractor_logic":"P(rain AND traffic) = P(rain) \u00d7 P(traffic|rain) = 0.3 \u00d7 0.8 = 0.24"},{"id":"t03_004","topic":"t03","scenario":"Events A and B are independent. P(A) = 0.5, P(B) = 0.4. What is P(A and B)?","choices":["A. 0.90","B. 0.20","C. 0.10","D. 0.50"],"answer":"B","difficulty":1,"concept":"independent_multiplication","distractor_logic":"Independent: P(A and B) = P(A) \u00d7 P(B) = 0.5 \u00d7 0.4 = 0.20"},{"id":"t03_005","topic":"t03","scenario":"In a batch of 100 products, 5 are defective. You pick 2 at random WITHOUT replacement. Is the second pick independent of the first?","choices":["A. Yes \u2014 always independent","B. No \u2014 sampling without replacement changes probabilities","C. Yes \u2014 if batch is large enough","D. Depends on defect rate"],"answer":"B","difficulty":2,"concept":"independence_without_replacement","distractor_logic":"Without replacement = dependent events; the first draw changes the pool"},{"id":"t03_006","topic":"t03","scenario":"60% of employees are full-time and 80% of full-timers have benefits. What percentage of all employees are full-time WITH benefits?","choices":["A. 80%","B. 60%","C. 48%","D. 140%"],"answer":"C","difficulty":2,"concept":"conditional_multiplication","distractor_logic":"P(FT and benefits) = 0.60 \u00d7 0.80 = 0.48 = 48%"},{"id":"t09_001","topic":"t09","scenario":"A value is 2 standard deviations above the mean in a normal distribution. Approximately what percentage of values fall below it?","choices":["A. 50%","B. 68%","C. 95%","D. 97.5%"],"answer":"D","difficulty":2,"concept":"empirical_rule","distractor_logic":"2 SD above mean: ~95% within \u00b12 SD, so ~97.5% below +2 SD"},{"id":"t09_002","topic":"t09","scenario":"Your data has mean = 100 and SD = 15. What's the z-score for a value of 130?","choices":["A. 2.0","B. 1.5","C. 3.0","D. 0.5"],"answer":"A","difficulty":1,"concept":"z_score_calculation","distractor_logic":"z = (130 - 100) / 15 = 30/15 = 2.0"},{"id":"t09_003","topic":"t09","scenario":"A student scores in the 84th percentile. Using the empirical rule, about how many standard deviations above the mean is this?","choices":["A. 0.5 SD","B. 1 SD","C. 2 SD","D. 3 SD"],"answer":"B","difficulty":2,"concept":"empirical_rule_percentile","distractor_logic":"68% within \u00b11 SD \u2192 84% below +1 SD (50% + 34%)"},{"id":"t09_004","topic":"t09","scenario":"Daily sales follow a normal distribution with mean $5,000 and SD $800. What's the probability of a day exceeding $6,600 in sales?","choices":["A. About 2.5%","B. About 5%","C. About 16%","D. About 50%"],"answer":"A","difficulty":2,"concept":"normal_tail_probability","distractor_logic":"z = (6600-5000)/800 = 2.0; P(Z > 2) \u2248 2.5%"},{"id":"t09_005","topic":"t09","scenario":"Salaries at your firm: mean $60k, SD $8k, roughly normal. A new analyst offer is $76k. What is its z-score?","choices":["A. 1.0","B. 2.0","C. 0.5","D. 16"],"answer":"B","difficulty":2,"concept":"z_score_calculation","distractor_logic":"z=(76-60)/8=2.0; 16 is the raw gap not standardized; 1.0 forgets to divide fully"},{"id":"t09_006","topic":"t09","scenario":"Two sales reps: Ana sold $520k in Region A (mean $400k, SD $60k). Ben sold $310k in Region B (mean $250k, SD $20k). Who performed better RELATIVE to their region?","choices":["A. Ana \u2014 higher dollars","B. Ben \u2014 higher z-score","C. Tie","D. Cannot compare different regions"],"answer":"B","difficulty":3,"concept":"z_score_comparison","distractor_logic":"Ana z=2.0, Ben z=3.0 \u2014 z-scores make different scales comparable; raw dollars ignore context; D is false, standardizing is exactly how you compare"},{"id":"t09_007","topic":"t09","scenario":"Delivery times are normal: mean 30 min, SD 5 min. You promise 'under 40 minutes or free.' Roughly what fraction of orders are free?","choices":["A. ~16%","B. ~5%","C. ~2.5%","D. ~0.3%"],"answer":"C","difficulty":3,"concept":"normal_tail_probability","distractor_logic":"40 is +2 SD; ~95% within \u00b12 SD leaves 5% in BOTH tails \u2014 only the upper 2.5% exceeds 40; 16% is the +1 SD tail; 0.3% is beyond \u00b13 SD"},{"id":"t09_008","topic":"t09","scenario":"Customer satisfaction scores are roughly normal with mean 7.0 and SD 0.5. About 68% of customers score between:","choices":["A. 6.5 and 7.5","B. 6.0 and 8.0","C. 5.5 and 8.5","D. 7.0 and 8.0"],"answer":"A","difficulty":1,"concept":"empirical_rule","distractor_logic":"68% is within \u00b11 SD (6.5-7.5); B is \u00b12 SD (95%); D is not centered on the mean"},{"id":"t09_009","topic":"t09","scenario":"Your revenue-per-customer data is HEAVILY right-skewed (a few whales). A colleague uses the empirical rule to claim '95% of customers are within 2 SD of the mean.' What's wrong?","choices":["A. Nothing \u2014 the rule always holds","B. The empirical rule requires roughly normal data","C. Should use 3 SD instead","D. SD can't be computed on skewed data"],"answer":"B","difficulty":3,"concept":"empirical_rule_assumptions","distractor_logic":"68-95-99.7 is a NORMAL-distribution fact; skew breaks it. SD computes fine on any data (D false); 3 SD doesn't rescue a wrong assumption"},{"id":"t01_010","topic":"t01","scenario":"For your firm's salaries, the mean is $72k and the median is $58k. Without seeing the data, what does this gap tell you?","choices":["A. Right-skewed \u2014 a few high salaries pull the mean up","B. Left-skewed","C. The data is normal","D. Someone made an error"],"answer":"A","difficulty":3,"concept":"mean_median_skew_inference","distractor_logic":"Mean dragged above median = long right tail (executive salaries); left skew would flip it; normal data would have them roughly equal"},{"id":"t02_008","topic":"t02","scenario":"Product A: mean daily sales $2,000, SD $300. Product B: mean $50,000, SD $4,000. Which has MORE RELATIVE variability?","choices":["A. B \u2014 bigger SD","B. A \u2014 higher coefficient of variation","C. Equal","D. Can't compare different products"],"answer":"B","difficulty":3,"concept":"cv_different_scales","distractor_logic":"CV_A=300/2000=15%, CV_B=4000/50000=8% \u2014 CV standardizes spread by the mean; raw SD comparison across scales misleads"},{"id":"t03_007","topic":"t03","scenario":"1% of shipments are defective. Your test flags 95% of defective shipments, but also flags 10% of good ones. A shipment is FLAGGED. The chance it's actually defective is closest to:","choices":["A. 95%","B. ~9%","C. 50%","D. 10%"],"answer":"B","difficulty":3,"concept":"conditional_base_rate","distractor_logic":"P(defect|flag) is not P(flag|defect). Flags: .01x.95 + .99x.10 = .1085; true: .0095; .0095/.1085 = 8.8%. The base rate dominates"},{"id":"t04_010","topic":"t04","scenario":"You list each store's sales the month BEFORE a promo and the month AFTER \u2014 same 25 stores, two columns. Which test fits?","choices":["A. Two-sample t \u2014 there are two columns","B. Paired t \u2014 same stores measured twice","C. ANOVA","D. Proportion test"],"answer":"B","difficulty":3,"concept":"paired_t","distractor_logic":"Two columns of the SAME units = paired, not independent samples; the column layout disguises the pairing"},{"id":"t04_011","topic":"t04","scenario":"With n = 2 million users, an A/B test finds a $0.02 lift in average order value, p = 0.001. What's the right takeaway?","choices":["A. Ship it \u2014 highly significant","B. Statistically significant but practically trivial \u2014 judge the effect size","C. The p-value must be wrong","D. Increase n to be sure"],"answer":"B","difficulty":3,"concept":"practical_vs_statistical","distractor_logic":"Huge n makes tiny effects 'significant' \u2014 significance is not importance; the p-value is fine; more n makes it worse, not clearer"},{"id":"t05_007","topic":"t05","scenario":"A 95% CI for average handle time is (4.2, 5.8) minutes. Management claims the true average is 6.0. At the 5% level (two-sided), the claim:","choices":["A. Is supported \u2014 6.0 is close","B. Would be rejected \u2014 6.0 lies outside the interval","C. Needs a bigger sample to evaluate","D. Can't be tested with a CI"],"answer":"B","difficulty":3,"concept":"ci_test_duality","distractor_logic":"A 95% CI contains exactly the values a two-sided 5% test would NOT reject; 6.0 outside = reject. CI-test duality is the point"},{"id":"t06_008","topic":"t06","scenario":"You have 5 regions and compare their mean sales with t-tests on every pair (10 tests) at 5% each. The real risk is:","choices":["A. Nothing \u2014 that's standard","B. Inflated false-positive rate \u2014 use ANOVA first","C. t-tests can't compare means","D. Too few tests"],"answer":"B","difficulty":3,"concept":"multiple_comparisons","distractor_logic":"Ten 5% tests \u2248 40% chance of at least one false positive; ANOVA controls the family-wise error, then post-hoc"},{"id":"t07_009","topic":"t07","scenario":"Your regression predicts sales from ad spend, fitted on spends of $1k-$10k. Marketing asks for the prediction at $50k. You should:","choices":["A. Plug it in \u2014 the equation works anywhere","B. Warn: that's extrapolation far outside the fitted range","C. Refuse to model ad spend","D. Use correlation instead"],"answer":"B","difficulty":3,"concept":"extrapolation_risk","distractor_logic":"The line is only evidence-backed within the observed range; at 5x beyond it the relationship may bend or saturate"},{"id":"t07_010","topic":"t07","scenario":"Ice-cream-truck staffing correlates r = 0.85 with beach-town retail sales. The honest explanation is most likely:","choices":["A. Staffing drives sales \u2014 hire more","B. Sales drive staffing","C. A third factor (summer season) drives both","D. r = 0.85 proves causation"],"answer":"C","difficulty":3,"concept":"confounding_variable","distractor_logic":"Season is the classic confounder moving both series; correlation alone orders no causal arrow, and 0.85 'strong' doesn't change that"},{"id":"t10_001","topic":"t10","scenario":"A call center wants to model HOW MANY support calls arrive each hour. Which distribution fits a count of events per time interval?","choices":["A. Normal","B. Poisson","C. Exponential","D. Uniform"],"answer":"B","difficulty":2,"concept":"poisson_recognition","distractor_logic":"Poisson models counts of independent events per interval; exponential models the TIME BETWEEN those events; normal fits continuous symmetric quantities, not small counts"},{"id":"t10_002","topic":"t10","scenario":"Same call center now asks: how long until the NEXT call comes in? Which distribution models waiting time between random events?","choices":["A. Exponential","B. Poisson","C. Binomial","D. Normal"],"answer":"A","difficulty":2,"concept":"exponential_recognition","distractor_logic":"Exponential = time between Poisson events. Counts are Poisson, gaps are exponential \u2014 the classic pairing. Normal fails: waiting times can't be negative and are right-skewed"},{"id":"t10_003","topic":"t10","scenario":"You email 500 customers and each independently has the same chance of clicking. Which distribution models the NUMBER of clicks out of 500?","choices":["A. Poisson","B. Exponential","C. Binomial","D. Uniform"],"answer":"C","difficulty":2,"concept":"binomial_recognition","distractor_logic":"Fixed number of trials + same success chance each = binomial. Poisson has no fixed n \u2014 it counts events in an open interval"},{"id":"t10_004","topic":"t10","scenario":"Adult customer heights, daily measurement errors, and average order values across many orders all tend toward the same shape. Which, and why?","choices":["A. Uniform \u2014 all values equally likely","B. Normal \u2014 many small independent influences add up","C. Poisson \u2014 they are counts","D. Exponential \u2014 they are waiting times"],"answer":"B","difficulty":2,"concept":"normal_recognition","distractor_logic":"Quantities built from many small independent effects sum toward the bell shape (the Central Limit idea). They're not counts, not waiting times, and definitely not equally likely everywhere"},{"id":"t10_005","topic":"t10","scenario":"Machine breakdowns average 2 per month, scattered randomly. To predict the chance of 5 breakdowns NEXT month, you reach for:","choices":["A. Poisson","B. Normal","C. Uniform","D. Paired t-test"],"answer":"A","difficulty":2,"concept":"poisson_prediction","distractor_logic":"Rare independent events counted over an interval = Poisson territory. Normal needs continuous symmetric data; a t-test compares groups, it doesn't predict event counts"},{"id":"t10_006","topic":"t10","scenario":"Poisson or exponential? Your manager asks (1) 'How many machine failures this quarter?' and (2) 'How long until the next failure?'","choices":["A. Both Poisson","B. Both exponential","C. (1) Poisson, (2) exponential","D. (1) exponential, (2) Poisson"],"answer":"C","difficulty":3,"concept":"poisson_vs_exponential","distractor_logic":"One process, two questions: COUNT of events \u2192 Poisson; TIME between events \u2192 exponential. Mixing them up is the most common distribution error in practice"},{"id":"t10_007","topic":"t10","scenario":"Why is the NORMAL distribution the default for modeling the AVERAGE of large samples, almost regardless of what the raw data looks like?","choices":["A. Most business data is normal","B. The Central Limit Theorem: averages of many observations tend toward normal","C. It's mathematically simplest","D. Regulators require it"],"answer":"B","difficulty":3,"concept":"clt_why","distractor_logic":"The CLT is the reason: sample MEANS go normal as n grows even when raw data is skewed. Raw business data is often NOT normal \u2014 that's exactly why the theorem matters"},{"id":"t10_008","topic":"t10","scenario":"Delivery times are always positive and heavily right-skewed (most fast, a few very slow). A colleague models them as normal. The core problem:","choices":["A. Nothing \u2014 normal handles everything","B. Normal is symmetric and allows negative values \u2014 it mismatches skewed, positive-only data","C. Normal only works for counts","D. Sample is too small"],"answer":"B","difficulty":3,"concept":"normal_misuse","distractor_logic":"Model shape must match data shape: normal predicts impossible negative times and understates the slow tail. Skewed positive durations want exponential/log-type models"},{"id":"t10_009","topic":"t10","scenario":"A raffle number is drawn where every ticket from 1 to 1000 is equally likely. Which distribution describes the draw?","choices":["A. Uniform","B. Normal","C. Poisson","D. Binomial"],"answer":"A","difficulty":1,"concept":"uniform_recognition","distractor_logic":"Equal likelihood across a range = uniform, the 'no preference' distribution. Normal peaks in the middle; Poisson and binomial are for counts"},{"id":"t10_010","topic":"t10","scenario":"Website crashes are rare (about 1 per 1000 hours). To budget downtime you need P(0 crashes) next month. The natural model:","choices":["A. Normal \u2014 always start there","B. Poisson \u2014 rare independent events per interval","C. Uniform \u2014 crashes are unpredictable","D. ANOVA"],"answer":"B","difficulty":2,"concept":"poisson_rare_events","distractor_logic":"Rare + independent + per-interval is Poisson's home turf, and P(0) is its bread and butter. 'Unpredictable' doesn't mean uniform; ANOVA compares group means"},{"id":"t10_011","topic":"t10","scenario":"The exponential distribution is called 'memoryless.' In plain business terms this means:","choices":["A. Old machines fail more often","B. The chance of an event in the next hour doesn't depend on how long you've already waited","C. It forgets outliers","D. It can't be used for forecasting"],"answer":"B","difficulty":3,"concept":"memoryless_meaning","distractor_logic":"Memoryless = the wait so far tells you nothing about the wait remaining (random arrivals, not wear-out). If aging DOES increase failure risk, exponential is the wrong model"},{"id":"t10_012","topic":"t10","scenario":"Pick the model: (a) number of no-shows among 40 booked appointments, (b) customers entering a store per hour, (c) time between website orders.","choices":["A. (a) binomial, (b) Poisson, (c) exponential","B. (a) Poisson, (b) binomial, (c) normal","C. All normal with enough data","D. (a) uniform, (b) Poisson, (c) Poisson"],"answer":"A","difficulty":3,"concept":"distribution_matching","distractor_logic":"Fixed trials \u2192 binomial; open-interval counts \u2192 Poisson; gaps between events \u2192 exponential. The three signatures worth memorizing as a set"},{"id":"t04_012","topic":"t04","scenario":"You changed the checkout button and want to know if the new CONVERSION RATE (percent who buy) beats the old one. Which method?","choices":["A. Two-sample t-test on revenue","B. Proportion test (A/B)","C. ANOVA","D. Correlation"],"answer":"B","difficulty":2,"concept":"method_selection_proportion","distractor_logic":"Percent-who-did-it is a PROPORTION, so compare proportions. A t-test compares means of a numeric measure; correlation measures association, not a difference"},{"id":"t04_013","topic":"t04","scenario":"What actually determines whether a result is called 'statistically significant'?","choices":["A. The p-value falling below the chosen significance level","B. The sample being large","C. The effect being big","D. The chart looking convincing"],"answer":"A","difficulty":2,"concept":"significance_definition","distractor_logic":"Significant = p-value below alpha, nothing more. Big samples and big effects influence the p-value but neither IS the criterion \u2014 and charts persuade, they don't test"},{"id":"t04_014","topic":"t04","scenario":"Choose the tool: same 30 salespeople measured before AND after a new commission plan; you ask whether average sales changed.","choices":["A. Paired t-test","B. Two-sample t-test","C. Proportion test","D. Regression"],"answer":"A","difficulty":2,"concept":"method_selection_paired","distractor_logic":"Same people, two moments \u2192 paired. Two-sample assumes independent groups; here each after-value belongs to a specific before-value"},{"id":"t04_015","topic":"t04","scenario":"Marketing claims the new campaign 'can only help, never hurt.' You pre-commit to testing ONLY for improvement. That choice is called:","choices":["A. A one-tailed test","B. A two-tailed test","C. Cherry-picking","D. ANOVA"],"answer":"A","difficulty":3,"concept":"one_vs_two_tailed","distractor_logic":"Direction fixed in advance \u2192 one-tailed, and it must be decided BEFORE seeing data \u2014 choosing it after peeking is where it becomes cherry-picking"},{"id":"t04_016","topic":"t04","scenario":"You suspect defect rates differ between day shift and night shift. The data is 'defective yes/no' for each unit by shift. Which method?","choices":["A. Two-proportion test","B. Two-sample t-test on defect counts","C. Correlation","D. Exponential model"],"answer":"A","difficulty":3,"concept":"method_selection_two_proportion","distractor_logic":"Yes/no outcomes by group = comparing two proportions. A t-test wants numeric measurements per unit; correlation wants two numeric variables"},{"id":"t06_009","topic":"t06","scenario":"Five ad campaigns, one numeric outcome (sales per customer). You want to know if ANY campaign differs before digging further. Start with:","choices":["A. ANOVA","B. Ten t-tests, one per pair","C. Correlation matrix","D. Chi-square"],"answer":"A","difficulty":2,"concept":"method_selection_anova","distractor_logic":"3+ group means, one numeric outcome \u2192 ANOVA first (one controlled test), THEN post-hoc for which pairs. Ten separate t-tests inflate false positives"},{"id":"t07_011","topic":"t07","scenario":"You want to PREDICT next month's sales (a number) from ad spend, seasonality, and price. Which method?","choices":["A. Multiple regression","B. ANOVA","C. Proportion test","D. Poisson"],"answer":"A","difficulty":2,"concept":"method_selection_regression","distractor_logic":"Predicting a numeric outcome from several inputs = multiple regression. ANOVA compares group means; proportion tests compare percentages; Poisson counts events"},{"id":"t07_012","topic":"t07","scenario":"You only want to know HOW STRONGLY two numeric variables move together \u2014 customer satisfaction and repeat purchases \u2014 not to predict one from the other. Use:","choices":["A. Correlation","B. Regression","C. Paired t-test","D. Histogram"],"answer":"A","difficulty":2,"concept":"correlation_vs_regression","distractor_logic":"Strength of association \u2192 correlation; an equation to predict one from the other \u2192 regression. Related tools, different questions"},{"id":"t07_013","topic":"t07","scenario":"The right ORDER of tools: you get a new dataset of two numeric variables and eventually want predictions. What's the sensible sequence?","choices":["A. Regression immediately \u2014 fastest","B. Scatter plot \u2192 correlation \u2192 regression if the relationship looks real and linear","C. ANOVA then t-tests","D. Confidence interval first, always"],"answer":"B","difficulty":3,"concept":"analysis_workflow","distractor_logic":"Look, then measure, then model: the plot catches curves and outliers that would silently wreck a straight-line regression fitted blind"},{"id":"t04_017","topic":"t04","scenario":"When is a CONFIDENCE INTERVAL the better report than a hypothesis test's reject/don't-reject verdict?","choices":["A. When stakeholders need the plausible SIZE of the effect, not just whether it exists","B. Never \u2014 tests are stricter","C. Only for small samples","D. When p-values are unavailable"],"answer":"A","difficulty":3,"concept":"ci_vs_test_when","distractor_logic":"A test answers 'is there an effect?'; an interval answers 'how big, plausibly?' \u2014 usually the business question. Same math underneath, different report"},{"id":"t04_018","topic":"t04","scenario":"Your test says p = 0.20 for a promising new supplier. The correct conclusion is:","choices":["A. The supplier makes no difference \u2014 proven","B. Not enough evidence to conclude a difference \u2014 which is NOT proof of no difference","C. The data is wrong","D. Run it until p < 0.05"],"answer":"B","difficulty":3,"concept":"fail_to_reject_meaning","distractor_logic":"Failing to reject \u2260 proving the null. Absence of evidence isn't evidence of absence \u2014 and re-running until significance is p-hacking, the cardinal sin"},{"id":"t00_001","topic":"t00","scenario":"You survey 400 customers to understand ALL 50,000 customers. The 50,000 are the ___ and the 400 are the ___.","choices":["A. population; sample","B. sample; population","C. parameter; statistic","D. census; poll"],"answer":"A","difficulty":1,"concept":"population_vs_sample","distractor_logic":"Population = the whole group you care about; sample = the part you actually measure. Parameter/statistic are the NUMBERS computed on each, not the groups"},{"id":"t00_002","topic":"t00","scenario":"The true average spend of ALL customers is a ___; the average spend of your 400 surveyed customers is a ___.","choices":["A. statistic; parameter","B. parameter; statistic","C. sample; population","D. margin; estimate"],"answer":"B","difficulty":2,"concept":"parameter_vs_statistic","distractor_logic":"Parameter = population truth (usually unknowable); statistic = the sample's version of it (what you compute). Statistics estimate parameters"},{"id":"t00_003","topic":"t00","scenario":"WHY do businesses sample instead of measuring the whole population?","choices":["A. Samples are more accurate than censuses","B. Cost and time \u2014 a good sample gets close enough for a fraction of the effort","C. Populations are illegal to measure","D. Software can't handle populations"],"answer":"B","difficulty":1,"concept":"why_sample","distractor_logic":"Sampling trades a small, quantifiable error for massive savings. A census isn't MORE wrong \u2014 it's usually just impossibly expensive or slow"},{"id":"t00_004","topic":"t00","scenario":"Two honest surveys of 400 customers each give slightly different average spends. This difference is called:","choices":["A. Bias","B. Sampling variability \u2014 different random samples naturally differ","C. A data error","D. Fraud"],"answer":"B","difficulty":2,"concept":"sampling_variability","distractor_logic":"Random samples wobble around the truth \u2014 that's variability, not bias. Bias is a systematic LEAN in one direction; wobble is expected and quantifiable"},{"id":"t00_005","topic":"t00","scenario":"You survey only customers who visit your website's feedback page. The danger is:","choices":["A. Sampling bias \u2014 volunteers aren't typical customers","B. Too much data","C. Sampling variability","D. Nothing, data is data"],"answer":"A","difficulty":2,"concept":"selection_bias","distractor_logic":"People who self-select to give feedback differ systematically (often angrier or happier) from the silent majority. No sample size fixes a biased door"},{"id":"t00_006","topic":"t00","scenario":"A bigger sample size fixes which problem \u2014 and NOT which other?","choices":["A. Fixes bias, not variability","B. Fixes variability, not bias","C. Fixes both","D. Fixes neither"],"answer":"B","difficulty":3,"concept":"bias_vs_variability","distractor_logic":"More data shrinks random wobble (variability) but a biased method just gets more precisely wrong. 10x the sample of website-feedback volunteers is still volunteers"},{"id":"t00_007","topic":"t00","scenario":"You want every customer to have an equal chance of being surveyed. That's a:","choices":["A. Random sample","B. Convenience sample","C. Stratified sample","D. Census"],"answer":"A","difficulty":1,"concept":"random_sample","distractor_logic":"Equal chance for everyone = simple random sampling, the gold standard against selection bias. Convenience = whoever's easy; stratified = deliberate groups first"},{"id":"t00_008","topic":"t00","scenario":"Your customers are 80% retail, 20% wholesale, and the groups behave very differently. To guarantee both are properly represented you use:","choices":["A. Stratified sampling \u2014 sample within each group proportionally","B. Convenience sampling","C. A smaller sample","D. Only the bigger group"],"answer":"A","difficulty":2,"concept":"stratified_when","distractor_logic":"When known subgroups differ, stratify: sample each stratum deliberately so neither is under-represented by luck. Pure random CAN miss small groups"},{"id":"t00_009","topic":"t00","scenario":"Interviewing shoppers at 2 PM on a Tuesday because that's when your intern is free is a classic:","choices":["A. Stratified sample","B. Convenience sample \u2014 and it systematically misses working customers","C. Random sample","D. Census"],"answer":"B","difficulty":2,"concept":"convenience_bias","distractor_logic":"Sampling whoever's easiest bakes in whoever's AROUND \u2014 Tuesday-2PM shoppers aren't your customer base. Cheap to collect, expensive to trust"},{"id":"t00_010","topic":"t00","scenario":"You study only your CURRENT customers to learn why customers leave. The trap is:","choices":["A. Survivorship bias \u2014 the ones who left aren't in your data","B. Sampling variability","C. The sample is too random","D. No trap"],"answer":"A","difficulty":3,"concept":"survivorship_bias","distractor_logic":"The exact people who hold the answer (churned customers) are missing by construction. Famous WWII planes: armor where the RETURNING planes weren't hit"},{"id":"t00_011","topic":"t00","scenario":"A survey question reads: 'Don't you agree our award-winning service is excellent?' The resulting distortion is:","choices":["A. Response bias \u2014 the wording pushes the answer","B. Sampling variability","C. A parameter problem","D. Perfectly fine"],"answer":"A","difficulty":2,"concept":"response_bias","distractor_logic":"Leading wording, social pressure, and embarrassment distort ANSWERS even from a perfect sample. Who you ask and how you ask are separate ways to fail"},{"id":"t00_012","topic":"t00","scenario":"When is a full CENSUS actually the right call over a sample?","choices":["A. Never \u2014 samples always win","B. When the population is small and each member matters (e.g., your 30 wholesale accounts)","C. When you want less accuracy","D. Only for governments"],"answer":"B","difficulty":3,"concept":"census_when","distractor_logic":"With 30 key accounts, just measure all 30 \u2014 sampling machinery exists for when measuring everyone is impractical, not as a religion"},{"id":"t04_019","topic":"t04","scenario":"Alpha = 0.05 means you've decided to accept what risk?","choices":["A. A 5% chance of a false alarm \u2014 calling an effect real when there's nothing there","B. A 5% chance the data is wrong","C. Being wrong 5% of all time forever","D. A 95% effect size"],"answer":"A","difficulty":2,"concept":"alpha_meaning","distractor_logic":"Alpha is your chosen false-positive (Type I) budget: how often you'll cry wolf when the null is actually true. It's a risk dial, not a fact about the data"},{"id":"t04_020","topic":"t04","scenario":"A p-value of 0.03 means:","choices":["A. 3% chance the null hypothesis is true","B. If there were truly no effect, data this extreme would show up only ~3% of the time","C. The effect is 97% real","D. The effect is large"],"answer":"B","difficulty":3,"concept":"p_value_meaning","distractor_logic":"The p-value assumes the null and asks how surprising your data is. It is NOT the probability the null is true and says nothing about effect SIZE \u2014 the two most common misreadings in business"},{"id":"t04_021","topic":"t04","scenario":"Lowering alpha from 0.05 to 0.01 makes false alarms rarer. The hidden price:","choices":["A. Nothing \u2014 stricter is free","B. More missed real effects (Type II errors) \u2014 you become harder to convince","C. Smaller samples needed","D. Bigger effects"],"answer":"B","difficulty":3,"concept":"type1_type2_tradeoff","distractor_logic":"The two error types trade off: demand stronger evidence and you'll wave through fewer false alarms but also miss more true effects. Choosing alpha = choosing which mistake you fear more"},{"id":"t04_022","topic":"t04","scenario":"A fraud-detection test and a marketing A/B test should probably use DIFFERENT alphas. Why?","choices":["A. They shouldn't \u2014 0.05 is universal","B. The cost of each error type differs: missing fraud is costly, a false marketing alarm is cheap","C. Fraud data is always normal","D. Marketing has more data"],"answer":"B","difficulty":3,"concept":"alpha_by_stakes","distractor_logic":"0.05 is a convention, not physics. Set your evidence bar by what each mistake costs the business \u2014 that's the entire art of choosing alpha"},{"id":"t04_023","topic":"t04","scenario":"Which scenario is a Type II error?","choices":["A. Launching a redesign that actually does nothing","B. Shelving a supplier who truly WAS better because your test didn't reach significance","C. Rejecting a true null","D. A coding mistake"],"answer":"B","difficulty":3,"concept":"type2_recognition","distractor_logic":"Type II = a real effect slips past you (the miss). Launching a do-nothing redesign is the false alarm (Type I). Both are business losses \u2014 only one shows up in your dashboard"},{"id":"t04_024","topic":"t04","scenario":"Your test on 30 customers finds a promising lift, p = 0.11. Before declaring failure, the FIRST thing to consider:","choices":["A. The test may be underpowered \u2014 30 people can miss real effects","B. The effect is proven fake","C. Switch to a pie chart","D. Lower alpha to 0.20"],"answer":"A","difficulty":3,"concept":"power_intuition","distractor_logic":"Small samples are blurry instruments: a real effect can easily produce p = 0.11 at n = 30. Power \u2014 the chance of DETECTING a real effect \u2014 comes from sample size; moving the goalposts (alpha 0.20) after the fact does not"},{"id":"t04_025","topic":"t04","scenario":"Running 20 different metrics through significance tests and reporting the one with p = 0.04 is called:","choices":["A. Thoroughness","B. P-hacking / multiple testing \u2014 at alpha 0.05, ~1 in 20 null metrics 'wins' by luck","C. Meta-analysis","D. Stratified testing"],"answer":"B","difficulty":3,"concept":"p_hacking","distractor_logic":"Twenty shots at a 5% target virtually guarantees a false hit. Pre-register the metric, or correct for multiple tests \u2014 otherwise the dashboard manufactures discoveries"},{"id":"t04_026","topic":"t04","scenario":"'Statistically significant' and 'important to the business' are:","choices":["A. The same thing","B. Different questions \u2014 significance is about evidence, importance is about effect size and cost","C. Both about sample size","D. Both about p-values"],"answer":"B","difficulty":2,"concept":"significance_vs_importance","distractor_logic":"A $0.02 lift can be highly significant with enough data and still be worthless; a huge lift can be non-significant in a tiny pilot yet worth chasing. Read the p-value AND the effect"},{"id":"t04_027","topic":"t04","scenario":"The honest sequence for an A/B test is:","choices":["A. Peek daily and stop the moment p < 0.05","B. Decide metric, alpha, and sample size up front; run to completion; then test once","C. Test many endpoints and keep the winners","D. Skip testing if the chart looks clear"],"answer":"B","difficulty":3,"concept":"testing_discipline","distractor_logic":"Optional stopping and endpoint shopping both inflate false positives. The pre-commitment IS the method \u2014 the math only means what it says if the plan came first"},{"id":"t05_008","topic":"t05","scenario":"'We are 95% confident average delivery is 2.1-2.9 days' properly means:","choices":["A. 95% of deliveries take 2.1-2.9 days","B. The METHOD captures the true average in 95% of studies like this one","C. There's a 95% chance any given delivery is on time","D. The true average moves around inside that range"],"answer":"B","difficulty":3,"concept":"ci_interpretation","distractor_logic":"The interval is about the unknown AVERAGE, not individual deliveries \u2014 and the 95% describes the procedure's reliability across repeated studies. The truth is fixed; it's your net that varies"},{"id":"t05_009","topic":"t05","scenario":"Which change makes a confidence interval NARROWER (more precise)?","choices":["A. Larger sample size","B. Higher confidence level (95% \u2192 99%)","C. More variable data","D. A smaller population"],"answer":"A","difficulty":2,"concept":"ci_width_drivers","distractor_logic":"More data = tighter estimate. Demanding MORE confidence widens the net; noisier data widens it too; population size barely matters once it's large"},{"id":"t05_010","topic":"t05","scenario":"Why does raising confidence from 95% to 99% WIDEN the interval?","choices":["A. It doesn't","B. To be more sure of catching the truth, you must cast a wider net","C. The data gets noisier","D. Software convention"],"answer":"B","difficulty":2,"concept":"confidence_width_tradeoff","distractor_logic":"Certainty and precision trade off: a wider range is easier to be right about. '0 to infinity' is 100% confident and 100% useless"},{"id":"t05_011","topic":"t05","scenario":"A poll reports 52% support with a \u00b13% margin of error. What CAN'T you conclude?","choices":["A. Plausible support is roughly 49-55%","B. That 52% is exactly right","C. That the poll acknowledges sampling uncertainty","D. That another equal poll might get 51%"],"answer":"B","difficulty":2,"concept":"margin_of_error_meaning","distractor_logic":"The margin exists precisely because 52% is an estimate, not the truth \u2014 a lead inside the margin is a statistical tie"},{"id":"t05_012","topic":"t05","scenario":"Your CI for the new process's average savings is (-$2, +$14) per unit. The business read is:","choices":["A. Savings are proven \u2014 the middle is positive","B. Zero is inside the interval: the data can't yet rule out 'no savings'","C. The process loses money","D. The interval is broken"],"answer":"B","difficulty":3,"concept":"ci_contains_zero","distractor_logic":"An interval straddling zero = the no-effect story is still plausible. Promising, worth more data \u2014 but not yet a decision-grade result"},{"id":"t05_013","topic":"t05","scenario":"When should you report a confidence interval INSTEAD of just the sample average?","choices":["A. Basically always \u2014 a point estimate without uncertainty invites false precision","B. Never, averages are cleaner","C. Only in academic papers","D. Only when results are bad"],"answer":"A","difficulty":2,"concept":"ci_reporting","distractor_logic":"'$4.20 lift' and '$4.20 \u00b1 $4.00 lift' justify very different decisions. The interval carries the honesty; the point alone hides it"},{"id":"t05_014","topic":"t05","scenario":"Two suppliers' quality CIs: A = (91%, 93%), B = (84%, 96%). Same midpoints roughly \u2014 what's the real difference?","choices":["A. Nothing \u2014 midpoints match","B. A is measured precisely; B is still a guess with a huge range \u2014 likely far less data","C. B is better","D. A has more bias"],"answer":"B","difficulty":3,"concept":"ci_width_reading","distractor_logic":"Width IS information: B's interval admits anything from bad to excellent. Comparing midpoints while ignoring widths is how thin data masquerades as knowledge"},{"id":"t05_015","topic":"t05","scenario":"Doubling your sample size does NOT halve the confidence interval's width. Why, intuitively?","choices":["A. It does halve it","B. Precision grows with the square root of n \u2014 diminishing returns to more data","C. Software rounds","D. Bias increases"],"answer":"B","difficulty":3,"concept":"root_n_intuition","distractor_logic":"To HALVE the width you need roughly 4x the data (root-n law). Budget accordingly: precision gets expensive fast"},{"id":"t05_016","topic":"t05","scenario":"You need the margin of error on your customer-satisfaction estimate cut in half for the board meeting. Roughly what sample increase does that take?","choices":["A. Double","B. Half","C. About four times","D. Ten times"],"answer":"C","difficulty":3,"concept":"sample_size_planning","distractor_logic":"Root-n again, applied: halving error quadruples required n. The single most useful planning fact about surveys"}];</script>
<script>
const TOPICS = {
  t00:"Sampling & Populations", t01:"Central Tendency", t02:"Variability",
  t03:"Probability", t04:"Hypothesis Testing & Significance",
  t05:"Confidence Intervals", t06:"ANOVA",
  t07:"Correlation & Regression", t09:"Normal Distribution",
  t10:"Choosing a Distribution"};
const TOPIC_NOTES = {
  t00:"A sample is your window on the population. Size fixes wobble (variability); only DESIGN fixes lean (bias) — a bigger biased sample is just more precisely wrong.",
  t01:"Center has three faces: mean (arithmetic balance, outlier-sensitive), median (the middle one, robust), mode (the most common). Mean pulled away from median = skew.",
  t02:"Spread is the other half of every story. SD for typical distance from the mean; IQR when outliers lurk; CV when comparing variability across different scales.",
  t03:"Probability discipline: P(A|B) is not P(B|A), rare things stay rare even with good tests (base rates), and 'and' multiplies only when events are independent.",
  t04:"Significant means one thing: p-value below your chosen alpha. It is evidence AGAINST 'nothing is happening' — not proof, not importance, not effect size.",
  t05:"An interval is an honest estimate: the range of plausible truths. Wider = less data, more noise, or more demanded confidence. If zero is inside, 'no effect' is still on the table.",
  t06:"Three or more group means? ANOVA first — one controlled test. Only after it fires do post-hoc tests say WHICH groups differ. Pairwise t-tests inflate false alarms.",
  t07:"Correlation measures moving-together; regression turns it into predictions. Neither proves causation — hunt the confounder, and never predict outside your data's range.",
  t09:"The bell curve earns its throne through the CLT: AVERAGES go normal even when raw data doesn't. Z-scores make different scales comparable; 68-95-99.7 needs actual normality.",
  t10:"Match the model to the data's birth: counts per interval → Poisson; time between events → exponential; successes in n trials → binomial; sums of many small causes → normal."
};
const LESSON_SIZE = 10;
let BANK = window.EMBEDDED_BANK || null;
let queue = [], current = null, firstTry = {}, rightFirst = 0, seenCount = 0,
    lessonTotal = 0, lastTopic = "all", answered = false;

// ── persistent stats (this phone only) ──────────────────────────────
function store(){ try{return JSON.parse(localStorage.sp_stats||"{}")}catch(e){return{}} }
function save(s){ try{localStorage.setItem("sp_stats", JSON.stringify(s))}catch(e){} }
function bumpDay(){
  const s = store(), today = new Date().toDateString();
  if (s.lastDay !== today){
    const y = new Date(Date.now()-864e5).toDateString();
    s.streak = (s.lastDay === y ? (s.streak||0) : 0) + 1;
    s.lastDay = today;
  }
  save(s); return s.streak||1;
}
function recordAnswer(topic, ok){
  const s = store();
  s.n = (s.n||0)+1; s.ok = (s.ok||0)+(ok?1:0);
  s.t = s.t||{}; s.t[topic] = s.t[topic]||{n:0,ok:0};
  s.t[topic].n++; if(ok) s.t[topic].ok++;
  save(s);
}

// ── home ────────────────────────────────────────────────────────────
function renderHome(){
  const s = store();
  document.getElementById("hStreak").textContent = "🔥 " + (s.streak||0);
  document.getElementById("hAnswered").textContent = s.n||0;
  document.getElementById("hAcc").textContent = s.n ? Math.round(100*s.ok/s.n)+"%" : "–";
  const counts = {};
  BANK.forEach(q => counts[q.topic] = (counts[q.topic]||0)+1);
  let html = `<button class="topic all" onclick="startLesson('all')">
      <div class="tn">▶ Mixed lesson — all topics</div>
      <div class="tm">${BANK.length} questions in the pool</div></button>`;
  for (const [t, name] of Object.entries(TOPICS)){
    if (!counts[t]) continue;
    const st = (s.t||{})[t]||{n:0,ok:0};
    const pct = st.n ? Math.round(100*st.ok/st.n) : 0;
    html += `<button class="topic" onclick="startLesson('${t}')">
      <div class="tn">${name}</div>
      <div class="mast"><div style="width:${pct}%"></div></div>
      <div class="tm">${counts[t]} Qs · ${st.n? pct+"% right" : "not started"}</div></button>`;
  }
  document.getElementById("topics").innerHTML = html;
}
function goHome(){
  show("home"); renderHome();
  document.getElementById("sheet").className = "sheet";
}

// ── lesson engine ───────────────────────────────────────────────────
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function startLesson(topic){
  lastTopic = topic;
  const pool = BANK.filter(q => topic==="all" || q.topic===topic);
  queue = shuffle([...pool]).slice(0, Math.min(LESSON_SIZE, pool.length));
  lessonTotal = queue.length;
  firstTry = {}; rightFirst = 0; seenCount = 0;
  show("lesson");
  nextCard();
}
function nextCard(){
  document.getElementById("sheet").className = "sheet";
  if (!queue.length){ return endLesson(); }
  current = queue.shift();
  answered = false;
  const done = lessonTotal - new Set(queue.map(q=>q.id)).size - (firstTry[current.id]===false && queue.every(q=>q.id!==current.id) ? 0 : 0);
  const uniqueLeft = new Set(queue.map(q=>q.id)).size + 1;
  document.getElementById("pfill").style.width =
      (100 * (lessonTotal - uniqueLeft) / lessonTotal) + "%";
  document.getElementById("qcount").textContent = (lessonTotal-uniqueLeft) + "/" + lessonTotal;
  document.getElementById("scenario").textContent = current.scenario;
  document.getElementById("choices").innerHTML = current.choices.map(c =>
    `<button class="choice" data-l="${c[0]}" onclick="pick(this)">${c}</button>`).join("");
  window.scrollTo(0,0);
}
function pick(btn){
  if (answered) return;
  answered = true;
  const chosen = btn.dataset.l, ok = chosen === current.answer;
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.l === current.answer) b.classList.add("correct");
    else if (b === btn && !ok) b.classList.add("wrong");
  });
  const first = !(current.id in firstTry);
  if (first){ firstTry[current.id] = ok; if(ok) rightFirst++; recordAnswer(current.topic, ok); }
  if (!ok){
    // Duolingo rule: you meet it again until you beat it
    const back = Math.min(queue.length, 2 + Math.floor(Math.random()*2));
    queue.splice(back, 0, current);
  }
  const correctText = current.choices.find(c => c[0]===current.answer);
  if (ok){
    const sheet = document.getElementById("sheet");
    sheet.classList.add("up", "good");
    document.getElementById("verdict").textContent = "✓ Correct!";
    document.getElementById("ansline").innerHTML = "<b>Answer:</b> " + correctText;
    document.getElementById("why").textContent = current.distractor_logic || "";
  } else {
    const chosenText = current.choices.find(c => c[0]===chosen);
    setTimeout(() => {
      document.getElementById("exScenario").textContent = current.scenario;
      document.getElementById("exPicked").textContent = chosenText;
      document.getElementById("exCorrect").textContent = correctText;
      document.getElementById("exWhy").textContent = current.distractor_logic || "";
      document.getElementById("exNote").textContent = TOPIC_NOTES[current.topic] || "";
      show("explain");
      window.scrollTo(0,0);
    }, 700);                                   // let the red flash land first
  }
}
function endLesson(){
  const streak = bumpDay();
  const acc = lessonTotal ? Math.round(100*rightFirst/lessonTotal) : 0;
  document.getElementById("sumRight").textContent = rightFirst + "/" + lessonTotal;
  document.getElementById("sumAcc").textContent = acc + "%";
  document.getElementById("sumStreak").textContent = "🔥 " + streak;
  document.getElementById("sumEmoji").textContent = acc>=80 ? "🎉" : acc>=50 ? "💪" : "📚";
  document.getElementById("sumTitle").textContent =
      acc>=80 ? "Excellent!" : acc>=50 ? "Solid work!" : "Keep drilling!";
  show("summary");
}
function backToQuiz(){
  show("lesson");
  nextCard();
}
function show(id){
  for (const s of ["home","lesson","summary","explain"])
    document.getElementById(s).classList.toggle("hidden", s!==id);
}

// ── boot: embedded bank (static/Pages) or fetch (class server) ──────
(async function(){
  if (!BANK){
    try { BANK = await (await fetch("/api/bank")).json(); }
    catch(e){ document.body.innerHTML = "<p style='padding:30px'>Could not load questions.</p>"; return; }
  }
  renderHome();
})();
</script>
</body>
</html>
